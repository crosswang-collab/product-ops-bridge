<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Roadmap 今天要決定的事</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2714%27 font-size=%2714%27%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════
   設計前提（改動前先讀）

   讀者是 COO，不是工程師。他早上開會前掃一眼，要的是一個二元判斷：
   今天要不要打斷某個團隊。所以：

   1. 第一眼看到的必須是結論，不是資料基準或品保狀態。
   2. 頁面上不出現內部黑話。在途存量→手上的工作量、pts→（不出現，
      一律換算成月）、Teams 歸戶→（移進說明）、RAG→（用人話狀態）。
   3. 每一張決策卡都要有「你要決定的是」，不能只丟問題就停。
   4. 卡片一律印名字，不能只印卡號 —— 要人決定哪張能挪期，卻要他
      自己去開 9 個 Jira 分頁，是設計失敗。
   5. 被點名過載的團隊 lead 會質疑數字。所以每個數字都要能點回 Jira，
      基準薄弱時要主動說「這個數字別當真」。

   三語：中文給 Cross，英文與日文給 JP／跨區團隊。卡片標題來自 Jira，
   本來就是英文，三種語言下都原樣顯示 —— 那是專有名詞，翻了反而對不上。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0b0e14; --s1:#141a24; --s2:#10151f; --s3:#1b2331; --bd:#232c3a;
  --tx:#e6ebf4; --mut:#8b96a8; --dim:#5a6577;
  /* 狀態色。#ffc233 取代舊的 #ffb454 —— 對紅綠色盲(protan)與綠色的
     可分辨度 ΔE 從 8.0 提升到 10.4（dataviz validator，surface #141a24）。
     負荷條實際相鄰的兩色是 --acc 與 --red：ΔE 16.4(deutan)/30.4(normal)，通過。
     狀態色一律搭配文字判定，不單靠顏色傳達意義。 */
  --red:#ff6b6b; --amb:#ffc233; --grn:#5fd39a; --acc:#5fd3e6;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:22px 18px 60px;
  background:radial-gradient(1200px 600px at 50% -10%,#121826,#0b0e14);
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans TC",
    "Noto Sans JP",sans-serif;
  line-height:1.6;
}
.wrap{max-width:880px;margin:0 auto}

/* ── ⓪ 工具列：語言切換 + 列印 ─────────────────────── */
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:20px}
.langs{display:inline-flex;background:var(--s2);border:1px solid var(--bd);
  border-radius:9px;padding:2px;gap:2px}
.langs button{appearance:none;background:none;border:none;cursor:pointer;
  color:var(--mut);font:inherit;font-size:12.5px;padding:5px 12px;border-radius:7px;
  white-space:nowrap}
.langs button:hover{color:var(--tx)}
.langs button[aria-current="true"]{background:var(--s3);color:var(--tx);font-weight:600}
.printbtn{appearance:none;background:var(--s2);border:1px solid var(--bd);cursor:pointer;
  color:var(--mut);font:inherit;font-size:12.5px;padding:6px 13px;border-radius:9px}
.printbtn:hover{color:var(--acc);border-color:var(--acc)}

/* ── ① 判決句：整頁最大的字，第一眼就是結論 ───────── */
.verdict{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.verdict.ok{color:var(--grn)}
.verdict.bad{color:var(--red)}
.asof{font-size:12.5px;color:var(--dim);margin-bottom:30px}
.asof b{color:var(--mut);font-weight:600}
@media(max-width:520px){.verdict{font-size:23px}}

.banner{border-radius:12px;padding:14px 16px;margin:0 0 22px;font-size:13.5px}
.banner.red{background:rgba(255,107,107,.10);border:1px solid var(--red);color:#ffd0d0}
.banner.red b{color:var(--red)}

/* ── ② 決策卡 ─────────────────────────────────────── */
.sec{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px;font-weight:700}
.cards{display:flex;flex-direction:column;gap:14px;margin-bottom:40px}
.card{background:var(--s1);border:1px solid var(--bd);border-left:4px solid var(--amb);
  border-radius:13px;padding:17px 19px}
.card.now{border-left-color:var(--red)}
.card.soon{border-left-color:var(--amb)}
.card.fyi{border-left-color:var(--dim)}
.card h3{font-size:17.5px;font-weight:700;margin:0 0 7px;line-height:1.35}
.mean{font-size:14px;color:var(--mut);margin:0 0 14px}
.mean .caveat{color:var(--amb)}

/* 決策卡裡的卡片清單：名字為主，卡號退居輔助 */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--bd);
  border-radius:9px;overflow:hidden;margin-bottom:14px}
.row{background:var(--s2);padding:9px 12px;display:flex;gap:10px;
  align-items:baseline;flex-wrap:wrap;font-size:13.5px}
.row .nm{flex:1 1 220px;min-width:0}
.row .id{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.row .team{font-size:12px;color:var(--mut);white-space:nowrap}
.row .st{font-size:12px;white-space:nowrap}
.row .st.w{color:var(--amb)}
.row .st.r{color:var(--red)}
.row .fresh{font-size:11px;color:var(--bg);background:var(--amb);font-weight:700;
  border-radius:5px;padding:1px 6px;white-space:nowrap}
.row a{color:inherit;text-decoration:none;border-bottom:1px solid var(--bd)}
.row a:hover{border-bottom-color:var(--acc);color:var(--acc)}

/* 「你要決定的是」—— 每張卡的收尾，缺這行就是只丟問題不給出口 */
.todo{font-size:13.5px;background:var(--s3);border-radius:9px;padding:11px 13px;
  color:var(--tx)}
.todo b{color:var(--acc);font-weight:600;font-size:11.5px;letter-spacing:.1em;
  display:block;margin-bottom:3px;text-transform:uppercase}

.allclear{background:var(--s1);border:1px solid var(--bd);border-left:4px solid var(--grn);
  border-radius:13px;padding:20px}
.allclear .w{font-size:13.5px;color:var(--mut);margin-top:5px}

/* ── ③ 團隊負荷圖 ─────────────────────────────────── */
.load{background:var(--s1);border:1px solid var(--bd);border-radius:13px;
  padding:19px;margin-bottom:14px}
.load h2{font-size:16px;font-weight:700;margin:0 0 3px}
.load .sub{font-size:12.5px;color:var(--mut);margin:0 0 18px}
.bars{display:flex;flex-direction:column;gap:15px}
/* 數值放在長條「外面」，不疊在填色上。
   疊在上面時，超載的紅字會落在紅色填色上 —— 紅字紅底，等於沒寫。 */
.bar{display:grid;grid-template-columns:100px 1fr 150px;gap:12px;align-items:center}
@media(max-width:560px){
  .bar{grid-template-columns:1fr auto;gap:5px 10px}
  .bar .nm{grid-column:1}
  .bar .val{grid-column:2;justify-content:flex-end}
  .bar .track{grid-column:1/-1}
}
.bar .nm{font-size:13px;font-weight:600}
.bar .track{position:relative;height:26px;background:var(--s2);
  border-radius:5px;overflow:hidden}
/* 正常區間帶：1.5–2.5 個月。位置本身就是判定依據，不必讀數字。 */
.bar .ok{position:absolute;top:0;bottom:0;background:rgba(95,211,154,.11);
  border-left:1px dashed rgba(95,211,154,.4);border-right:1px dashed rgba(95,211,154,.4)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:0 5px 5px 0;
  background:var(--acc)}
.bar .fill.over{background:var(--red)}
/* 正常範圍的上限線，疊在填色之上 */
.bar .limit{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;
  background:var(--grn);opacity:.85}
.bar .val{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
  font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--tx)}
.bar .val b{font-weight:600}
.bar .val .verdict-txt{color:var(--mut);font-weight:400}
.bar .val .verdict-txt.over{color:var(--red);font-weight:600}
.bar .val.na{color:var(--dim)}
.bar .none{position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent,transparent 5px,
    rgba(90,101,119,.13) 5px,rgba(90,101,119,.13) 10px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);
  margin-top:16px;padding-top:13px;border-top:1px solid var(--bd)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:middle;font-style:normal}

/* 決策卡內的「其他 N 個」摺疊 */
details.more{margin-bottom:14px;background:none;border:none;border-radius:0}
details.more>summary{padding:6px 2px;font-size:12.5px;font-weight:500;color:var(--mut)}
details.more>summary::after{content:"▾";font-size:10px}
details.more[open]>summary::after{content:"▴"}
details.more>summary:hover{color:var(--acc)}
details.more .rows{margin-bottom:0}

/* ── ④ 摺疊細節 ───────────────────────────────────── */
details{background:var(--s1);border:1px solid var(--bd);border-radius:13px;
  margin-bottom:11px;overflow:hidden}
summary{cursor:pointer;padding:14px 19px;font-size:14.5px;font-weight:600;
  list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--dim);font-size:11px;align-self:center}
details[open] summary::after{content:"▴"}
summary .tag{font-size:12px;color:var(--mut);font-weight:400;text-align:right}
.body{padding:0 19px 19px;font-size:13px}
.body>p:first-child{margin-top:0;color:var(--mut);font-size:12.5px}
.chg-h{margin:18px 0 7px;font-size:12.5px;font-weight:700;color:var(--tx);
  display:flex;align-items:baseline;gap:8px}
.chg-h span{font-weight:400;color:var(--dim);font-size:11.5px}
.chg-note{margin:0 0 7px;font-size:11.5px;color:var(--dim)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.05em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
a{color:var(--acc)}
.w-txt{color:var(--amb)}
.r-txt{color:var(--red)}
.thin{color:var(--amb);font-size:11.5px}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--bd);
  font-size:11.5px;color:var(--dim);line-height:1.85}
.foot code{background:var(--s2);padding:1px 5px;border-radius:4px}
.err{background:rgba(255,107,107,.10);border:1px solid var(--red);border-radius:13px;
  padding:19px;color:#ffd0d0;font-size:14px}
.err b{color:var(--red)}

/* ═══════════════════════════════════════════════════════════════
   列印 / 存成 PDF

   深色底列印出來是一整片黑，既吃墨又難讀，而且這份 PDF 是要轉給
   JP 團隊看的 —— 所以列印時整份翻成淺色，不是把螢幕原樣印出去。
   摺疊區在 beforeprint 由 JS 全部展開，列印完再收回原狀。
   ═══════════════════════════════════════════════════════════════ */
@media print{
  @page{margin:14mm}
  :root{
    --bg:#fff; --s1:#fff; --s2:#fafafa; --s3:#f4f6f8; --bd:#d5dae1;
    --tx:#111417; --mut:#4a5260; --dim:#6b7480;
    --red:#c0392b; --amb:#9a6a00; --grn:#1e7d4f; --acc:#0f6d80;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#111417;padding:0;font-size:11pt;line-height:1.5}
  .wrap{max-width:none}
  .tools{display:none}           /* 語言切換與列印鈕本身不印 */
  .verdict{font-size:20pt}
  .card,.load,details,.allclear{break-inside:avoid;page-break-inside:avoid}
  .card,.load,details,.allclear{box-shadow:none}
  details{border:1px solid var(--bd)}
  summary{cursor:default}
  summary::after,details.more>summary::after{content:""}
  .row a,a{color:inherit;text-decoration:none;border-bottom:none}
  /* 列印時把 Jira 連結的卡號留著就夠了，不印整串網址 */
  .foot{page-break-inside:avoid}
  .sec{color:#6b7480}
}
</style>
</head>

<div class="wrap" id="app"><div class="asof">載入中… / Loading… / 読み込み中…</div></div>

<script>
// 資料全部來自 /roadmap-bot/out/latest.json（機器產生的事實層，每天自動更新）。
// 這一頁不做任何 LLM 判讀 —— 下面的門檻是寫死的規則，不是意見。

const SAME_DAY_ALERT = 5;            // 同一天發佈幾張以上要提醒
const OK_BAND = [1.5, 2.5];          // 「正常」的手上工作量區間（月），對齊 extract.py 的 WIP_BANDS
const LANG_KEY = 'roadmap-lang';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idOf  = k => esc(String(k || '').replace('APPIDEAS-', ''));
const round = n => Math.round(n * 10) / 10;

// ═══════════════════════════════════════════════════════════════
// 三語文案
//
// 卡片標題（summary）來自 Jira，三語都原樣顯示 —— 那是專有名詞，
// 翻了反而跟 Jira 對不上，被點名的團隊會找不到是哪張卡。
// ═══════════════════════════════════════════════════════════════
const I18N = {
  zh: {
    htmlLang:'zh-Hant', label:'中文', docTitle:'Roadmap 今天要決定的事',
    print:'列印 / 存成 PDF',
    vStale:'這不是今天的資料。', vClear:'今天沒事。',
    vN: n => `今天有 ${n} 件事要你決定。`,
    asOf: d => `這是 <b>${d}</b> 的 roadmap`,
    activeN: n => `進行中的案子 <b>${n}</b> 個`,
    autoUpd:'每天早上自動更新',
    staleBanner: (a,t) => `<b>最新的一份是 ${a}，今天是 ${t}。</b>
      自動抓取可能失敗了，下面的內容都是舊的。去 GitHub Actions 看 <code>roadmap-daily</code> 最後一次跑的結果。`,
    secDecide:'今天要決定的事', secFyi:'知道就好，今天不用動作', secBg:'背景參考',
    todoLabel:'你要決定的是',
    allClearH:'全部正常。',
    allClearW: n => `沒有同一天擠超過 ${n} 個上線、沒有團隊塞太滿或快沒事做、`
      + `沒有案子被標風險、沒有資料抓壞。下面的細節今天可以不看。`,
    when: d => d===0?'今天':d===1?'明天':d>1?`${d} 天後`:d===-1?'昨天':`${-d} 天前`,
    status:{'On track':'順利','Warning':'注意','At Risk':'有風險'}, statusNone:'未標',
    noTeam:'未分',
    othersN: n => `其他 ${n} 個`, whichN: n => `看是哪 ${n} 個`,
    noTitle: id => `（查不到標題，卡號 ${id}）`,

    blockH: n => `有 ${n} 筆資料抓壞了`,
    blockM:'在修好之前，這一頁其他數字都可能是錯的。',
    blockT:'轉給工程確認 Jira 欄位。這通常代表卡片上有必填欄位空著。',

    relH: (w,n) => `${w}要上線 ${n} 個功能`,
    relM: n => `同一天上這麼多，回歸測試會全部擠在一起；其中一個出問題，其他 ${n-1} 個都會被拖住。`,
    relMPast:'這天已經過了，列在這裡只是讓你知道發生過。',
    relTPast:'不用動作。',
    relT1:'看有沒有一兩個可以往後挪一週。先看上面標「注意」的那一個 —— 它最可能是拖累別人的那個。',
    relTN: n => `看有沒有一兩個可以往後挪一週。先看上面標「注意」的那 ${n} 個 —— 它們最可能是拖累別人的。`,
    relT0:'看有沒有一兩個可以往後挪一週，把風險攤開。',

    wipH: (d,m) => `${d} 手上的工作要做 ${m} 個月才做得完`,
    wipM: (m,c) => `他們平常一個月消化得掉的量，現在手上壓了 ${m} 個月份。`
      + `現在丟新的需求過去，只會排在這 ${c} 張後面。`,
    wipThin: n => ` <span class="caveat">⚠ 這個倍數是拿他們過去只有 ${n} 個案子的紀錄推的，`
      + `樣本太少 —— 方向可信，數字本身別當真。</span>`,
    wipT: (c,d) => `要嘛從這 ${c} 個裡砍掉幾個，要嘛先別再往 ${d} 丟新的。兩個都不做，就是默認這些全部一起延。`,

    upH: d => `${d} 快沒有新案子可以做了`,
    upM: (c,days) => `還在規劃階段的只剩 ${c} 張，大約 ${days} 天就會做完。`
      + `之後這個團隊會閒下來 —— 現在不補案子，中間會空一段。`,
    upT: d => `現在就要開始想 ${d} 下一批要做什麼。等他們真的閒下來才補，中間至少空一個月。`,

    riskH: n => `${n} 個案子被標成「有風險」`,
    riskM:'這是負責的 PM 自己標的，代表他們認為會延或會出事。',
    riskT:'一個一個問清楚：延多久、卡在哪、需不需要你出面。',
    warnH: n => `${n} 個案子被標成「注意」`,
    warnM:'不是紅燈，是負責的 PM 自己覺得有點風險。上面幾件事裡有些就是它們。',
    warnT:'不用動作。有你在意的名字再去問。',

    baseH:'團隊產能的比較基準過期了',
    baseM: (l,e) => `基準鎖在 ${l}，${e} 就該重算。上面所有「幾個月做得完」都還在用舊基準。`,
    baseT:'請 PMT 重算這一季的基準，然後更新 extract.py 裡的 BASELINES。',

    loadH:'各團隊手上塞了多少',
    loadSub:'手上還沒做完的工作，照這個團隊過去的速度要做幾個月。超過綠線就是塞太滿。',
    months: m => `${m} 個月`,
    vOver:'塞太滿', vNormal:'正常', vLow:'偏空', thinMark:'⚠ 基準薄弱', noBase:'沒有基準可比',
    noBaseTip: d => `${d} 這一季還沒算過產能基準，所以沒辦法換算成月`,
    barTip: (d,c,m) => `${d}：手上 ${c} 張，照過去的速度要 ${m} 個月做完`,
    barTipThin: n => `（基準樣本只有 ${n} 個案子，僅供參考）`,
    legNormal:'正常範圍內', legOver:'超出正常範圍',
    legLimit: m => `正常上限（${m} 個月）—— 超過這條線就是塞太滿`,

    dUpcoming:'接下來要上線的東西', dStages:'案子走到哪一步了',
    dAll:'全部進行中的案子', dSource:'這些數字哪來的',
    unitN: n => `${n} 個`,
    thDate:'日期', thName:'名稱', thTeam:'團隊', thStatus:'PM 標的狀態',
    thStage:'階段', thCount:'幾個', thRelease:'預計上線', thProject:'案子', thNote:'提醒',

  try { const v = localStorage.getItem(LANG_KEY); return I18N[v] ? v : null; } catch { return null; }

const zhStatus = s => (L.status[s] || s || L.statusNone);
const statusCls = s => s === 'At Risk' ? 'r' : s === 'Warning' ? 'w' : '';

// 用「今天／N 天後」講日期，比 2026-09-02 好懂，也讓過期的事自動退位
function whenLabel(dateStr, today) {
  const d = Math.round((Date.parse(dateStr + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 86400000);
  return Number.isNaN(d) ? esc(dateStr) : L.when(d);
}

const rowHtml = c => `
    <div class="row">
      <span class="nm">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.summary)}</a>`
                              : esc(c.summary)}</span>
      <span class="team">${esc(c.domain || L.noTeam)}</span>
      <span class="st ${statusCls(c.project_status)}">${esc(zhStatus(c.project_status))}</span>${
        WORSENED.has(c.key) ? `<span class="fresh">${esc(L.justWorse)}</span>` : ''}
      <span class="id">${idOf(c.key)}</span>
    </div>`;

// 決策卡裡只把「需要看的那幾個」攤開，其餘收起來。
// 全部攤開會讓第一屏變成三十幾行清單，等於逼 COO 捲很久才看得完一件事 ——
// 這一頁的工作是 60 秒內給一個要不要介入的判斷，不是把 Jira 搬過來。
function rowsHtml(items, collapseAll) {
  if (!items || !items.length) return '';
  const flagged = collapseAll ? []
    : items.filter(c => c.project_status === 'Warning' || c.project_status === 'At Risk');
  const rest = items.filter(c => !flagged.includes(c));
  let h = flagged.length ? `<div class="rows">${flagged.map(rowHtml).join('')}</div>` : '';
  if (rest.length) {
    h += `<details class="more"><summary>${flagged.length ? L.othersN(rest.length) : L.whichN(rest.length)}</summary>
      <div class="rows">${rest.map(rowHtml).join('')}</div></details>`;
  }
  return h;
}

// ── 決策清單。順序 = 急迫度，不是資料表的順序。 ──────────────
function decisions(d, today) {
  const a = d.aggregate || {}, out = [];
  const cards = d.cards || [];
  const byKey = Object.fromEntries(cards.map(c => [c.key, c]));
  // 發佈母體含 issuetype=Tech 的卡（不在 active 集合裡），所以名字要從
  // upcoming_releases 補，不能只查 cards —— 查不到就只剩一個卡號，等於沒說。
  const relInfo = Object.fromEntries((a.upcoming_releases || []).map(u => [u.key, u]));
  // changes 是 2026-09-02 才加的欄位。舊的快照沒有，要能容忍缺席。
  const ch = d.changes || {};
  WORSENED = new Set((ch.status_changed || []).filter(x => x.worsened).map(x => x.key));

  // ① 資料 blocker —— 比任何紅燈都優先，因為它讓下面每個數字都不可信
  const blockers = (d.data_quality || []).filter(x => x.severity === 'blocker');
  if (blockers.length) {
    out.push({ lvl:'now', h:L.blockH(blockers.length), mean:L.blockM,
      rows: blockers.map(b => ({ summary:b.issue, key:b.key,
                                 domain:(byKey[b.key]||{}).domain, project_status:null,
                                 url:(byKey[b.key]||{}).url })),
      todo:L.blockT });
  }

  // ② 同日發佈過度集中。已經過去的日子不再是決策，排到最後面。
  for (const r of (a.release_concentration || [])) {
    if (r.count < SAME_DAY_ALERT) continue;
    const past = Date.parse(r.date + 'T00:00:00Z') < Date.parse(today + 'T00:00:00Z');
    const items = r.keys.map(k => relInfo[k] || byKey[k] || { key:k, summary:L.noTitle(idOf(k)) })
                        .map(u => ({ ...u, url:(byKey[u.key] || {}).url ||
                                       `https://17media.atlassian.net/browse/${u.key}` }));
    const risky = items.filter(u => u.project_status === 'Warning' || u.project_status === 'At Risk');
    out.push({
      lvl: past ? 'fyi' : 'now', collapseAll: past,
      h: L.relH(whenLabel(r.date, today), r.count),
      mean: past ? L.relMPast : L.relM(r.count),
      rows: items,
      todo: past ? L.relTPast
        : risky.length === 1 ? L.relT1
        : risky.length > 1   ? L.relTN(risky.length)
        : L.relT0
    });
  }

  // ③ 團隊手上塞太滿
  for (const [dom, v] of Object.entries(a.domains_by_capacity || {})) {
    if (v.wip_verdict !== 'overload') continue;
    out.push({
      lvl:'now',
      h: L.wipH(dom, round(v.wip_months)),
      mean: L.wipM(round(v.wip_months), v.cards) + (v.baseline_thin ? L.wipThin(v.baseline_n) : ''),
      rows: cards.filter(c => (c.capacity_domains || []).includes(dom)),
      todo: L.wipT(v.cards, dom)
    });
  }

  // ④ 上游快沒東西可做（兩個月後才會痛，但現在不補就來不及）
  for (const [dom, v] of Object.entries(a.domains_by_capacity || {})) {
    if (v.upstream_verdict !== 'starving') continue;
    out.push({
      lvl:'soon',
      h: L.upH(dom),
      mean: L.upM(v.upstream_cards, Math.round((v.upstream_months || 0) * 30)),
      rows: cards.filter(c => (c.capacity_domains || []).includes(dom) &&
                              (c.stage === 'Discovery' || c.stage === 'Design')),
      todo: L.upT(dom)
    });
  }

  // ⑤ 自從上一份快照之後「變差」的卡。
  // 這是「跟昨天比」最值得單獨拉出來的一件事：狀態剛翻的時候去問，
  // 比等到它真的延期才問有用。
  //
  // 但已經是「有風險」的卡不放進來 —— 它們在下面 ⑥ 有自己的紅色卡片，
  // 而且那張卡上的「剛變差」標記已經標出哪幾個是新的。兩張卡列同樣兩張票，
  // 讀者只會覺得同一件事被講了兩次（v1 實測就長這樣）。
  // 這裡專門收「順利 → 注意」這種：不放進來的話，它只會沉在最下面的
  // 「知道就好」清單裡，跟已經注意兩個禮拜的卡混在一起，完全看不出是新的。
  const worsened = (ch.status_changed || [])
    .filter(x => x.worsened && x.to !== 'At Risk');
  if (worsened.length) {
    out.push({
      lvl:'soon', h:L.worseH(worsened.length), mean:L.worseM(L.chWhen(ch.days_ago)),
      rows: worsened.map(x => ({ ...x, project_status: x.to,
                                 url: (byKey[x.key] || {}).url ||
                                      `https://17media.atlassian.net/browse/${x.key}` })),
      todo:L.worseT
    });
  }

  // ⑥ PM 自己標了風險的卡（常態清單，不管是不是今天才變的）
  const risk = cards.filter(c => c.project_status === 'At Risk');
  const warn = cards.filter(c => c.project_status === 'Warning');
  if (risk.length) {
    out.push({ lvl:'now', h:L.riskH(risk.length), mean:L.riskM, rows:risk, todo:L.riskT });
  }
  if (warn.length) {
    out.push({ lvl:'fyi', h:L.warnH(warn.length), mean:L.warnM,
               rows:warn, collapseAll:true, todo:L.warnT });
  }

  // ⑥ 比較基準過期
  if (d.baseline && d.baseline.expired) {
    out.push({ lvl:'soon', h:L.baseH,
      mean:L.baseM(esc(d.baseline.locked_at), esc(d.baseline.expires_at)),
      rows:[], todo:L.baseT });
  }

  const rank = { now:0, soon:1, fyi:2 };
  return out.sort((x, y) => rank[x.lvl] - rank[y.lvl]);
}

// ── 團隊負荷圖 ────────────────────────────────────────────────
// 形式：橫條 + 正常區間帶。位置本身就是判定，不必讀數字也不必解讀顏色。
// 顏色只有兩態（正常青／超載紅，CVD 已驗證），且每條都附文字判定，
// 不單靠顏色傳達意義。沒有基準的團隊畫成斜線空槽，不畫成 0。
function loadChart(a) {
  const entries = Object.entries(a.domains_by_capacity || {})
    .sort((x, y) => (y[1].wip_months || -1) - (x[1].wip_months || -1));
  if (!entries.length) return '';
  const max = Math.max(3, ...entries.map(([, v]) => v.wip_months || 0)) * 1.12;
  const pct = m => Math.min(100, (m / max) * 100);

  const bars = entries.map(([dom, v]) => {
    if (v.wip_months == null) {
      return `<div class="bar"><div class="nm">${esc(dom)}</div>
        <div class="track" title="${esc(L.noBaseTip(dom))}"><div class="none"></div></div>
        <div class="val na">${esc(L.noBase)}</div></div>`;
    }
    const over = v.wip_months > OK_BAND[1];
    const verdict = over ? L.vOver : v.wip_months < OK_BAND[0] ? L.vLow : L.vNormal;
    const tip = L.barTip(dom, v.cards, round(v.wip_months))
              + (v.baseline_thin ? L.barTipThin(v.baseline_n) : '');
    // 上限線畫在填色「之上」—— 畫在下面的話，超載的長條會把整條正常區間蓋住，
    // 「超過了多少」這個唯一重點就看不見了（v1 的實測錯誤）。
    return `<div class="bar"><div class="nm">${esc(dom)}</div>
      <div class="track" title="${esc(tip)}">
        <div class="ok" style="left:${pct(OK_BAND[0])}%;width:${pct(OK_BAND[1]) - pct(OK_BAND[0])}%"></div>
        <div class="fill${over ? ' over' : ''}" style="width:${pct(v.wip_months)}%"></div>
        <div class="limit" style="left:${pct(OK_BAND[1])}%"></div>
      </div>
      <div class="val"><b>${esc(L.months(round(v.wip_months)))}</b>
        <span class="verdict-txt${over ? ' over' : ''}">${esc(verdict)}</span>${
        v.baseline_thin ? `<span class="verdict-txt">${esc(L.thinMark)}</span>` : ''}</div>
    </div>`;
  }).join('');

  return `<div class="load">
    <h2>${esc(L.loadH)}</h2>
    <p class="sub">${esc(L.loadSub)}</p>
    <div class="bars">${bars}</div>
    <div class="legend">
      <span><i style="background:var(--acc)"></i>${esc(L.legNormal)}</span>
      <span><i style="background:var(--red)"></i>${esc(L.legOver)}</span>
      <span><i style="background:var(--grn);width:2px;border-radius:0"></i>${esc(L.legLimit(OK_BAND[1]))}</span>
    </div>
  </div>`;
}

// ── 跟上一份快照比，動了什麼 ──────────────────────────────────
// 這一段是「比較基準 = 昨天的自己」的直接產物。它不做判斷，只列事實：
// 誰進來、誰走了、誰換階段、誰改狀態、誰改日期、哪個團隊的量變了。
// 真正需要你動作的（狀態變差）已經被拉到上面的決策卡，這裡是完整清單。
function changesSection(ch) {
  if (!ch) return '';          // 2026-09-02 之前的快照沒有這個欄位
  const tag = !ch.has_previous ? L.chTagFirst
            : !ch.total ? L.chTagNone : L.chTag(ch.total);

  let body;
  if (!ch.has_previous) {
    body = `<p>${esc(L.chNoPrev)}</p>`;
  } else {
    body = `<p>${esc(L.chHead(L.chWhen(ch.days_ago), ch.since,
                              ch.active_from, ch.active_to))}</p>`;
    if (!ch.total) {
      body += `<p>${esc(L.chSame)}</p>`;
    } else {
      const crow = (x, what, warn) => `<div class="row">
          <span class="nm"><a href="https://17media.atlassian.net/browse/${esc(x.key)}"
            target="_blank" rel="noopener">${esc(x.summary)}</a></span>
          <span class="team">${esc(x.domain || L.noTeam)}</span>
          <span class="st${warn ? ' w' : ''}">${esc(what)}</span>
          <span class="id">${idOf(x.key)}</span>
        </div>`;
      const grp = (label, items, rows, note) => items.length ? `
        <p class="chg-h">${esc(label)}<span>${items.length}</span></p>
        ${note ? `<p class="chg-note">${esc(note)}</p>` : ''}
        <div class="rows">${rows}</div>` : '';
      const arrow = (a, b) => `${a || '—'} → ${b || '—'}`;
      const relTxt = x => arrow(x.from || L.tbd, x.to || L.tbd)
        + (Number.isInteger(x.days) && x.days > 0 ? ` · ${L.chDelay(x.days)}`
         : Number.isInteger(x.days) && x.days < 0 ? ` · ${L.chEarly(-x.days)}` : '');

      body +=
        grp(L.chStatus, ch.status_changed,
            ch.status_changed.map(x => crow(x, arrow(zhStatus(x.from), zhStatus(x.to)), x.worsened))) +
        grp(L.chAdded, ch.added,
            ch.added.map(x => crow(x, L.stage[x.stage] || x.stage || '—'))) +
        grp(L.chRemoved, ch.removed,
            ch.removed.map(x => crow(x, `${L.stage[x.last_stage] || x.last_stage || '—'}`)),
            L.chRemovedNote) +
        grp(L.chStage, ch.stage_moved,
            ch.stage_moved.map(x => crow(x, arrow(L.stage[x.from] || x.from,
                                                  L.stage[x.to] || x.to)))) +
        grp(L.chRelease, ch.release_moved,
            ch.release_moved.map(x => crow(x, relTxt(x)))) +
        grp(L.chLoad, ch.load_changed, ch.load_changed.map(x => `<div class="row">
              <span class="nm">${esc(x.domain)}</span>
              <span class="st">${esc(L.chMonths(x.from ?? '—', x.to ?? '—'))}</span>
            </div>`));
    }
  }
  return `<details><summary>${esc(L.dChanges)}<span class="tag">${esc(tag)}</span></summary>
    <div class="body">${body}</div></details>`;
}

function toolbar() {
  return `<div class="tools">
    <div class="langs" role="group">
      ${Object.entries(I18N).map(([k, v]) =>
        `<button type="button" data-lang="${k}" aria-current="${k === LANG}">${esc(v.label)}</button>`
      ).join('')}
    </div>
    <button type="button" class="printbtn" id="printbtn">${esc(L.print)}</button>
  </div>`;
}

function render(d) {
  const a = d.aggregate || {}, today = new Date().toISOString().slice(0, 10);
  const stale = d.as_of_date !== today;
  const q = decisions(d, today);
  const act = q.filter(i => i.lvl !== 'fyi').length;
  const H = [toolbar()];

  document.documentElement.lang = L.htmlLang;
  document.title = L.docTitle;

  // ── ① 判決句：整頁第一眼 ──
  H.push(stale ? `<p class="verdict bad">${esc(L.vStale)}</p>`
       : act === 0 ? `<p class="verdict ok">${esc(L.vClear)}</p>`
       : `<p class="verdict bad">${esc(L.vN(act))}</p>`);

  // 用 as_of_date 而不是 generated_at —— 上面的「這不是今天的資料」判斷是拿
  // as_of_date 比的，兩處顯示不同欄位會出現「橫幅說 8/27、副標說 9/1」的矛盾。
  H.push(`<p class="asof">${L.asOf(esc(d.as_of_date))}　${L.activeN((d.cards || []).length)}　${esc(L.autoUpd)}</p>`);

  if (stale) H.push(`<div class="banner red">${L.staleBanner(esc(d.as_of_date), today)}</div>`);

  // ── ② 決策卡 ──
  H.push(`<p class="sec">${esc(L.secDecide)}</p>`);
  if (!q.length) {
    H.push(`<div class="allclear"><div class="verdict ok" style="font-size:17px;margin:0">${esc(L.allClearH)}</div>
      <div class="w">${esc(L.allClearW(SAME_DAY_ALERT))}</div></div>`);
  } else {
    // 需要動作的排在前面；「知道就好」的用一條分隔線隔開，
    // 否則標題說 4 件、畫面上卻數得出 5 塊，讀者會不信任這個數字。
    const cardHtml = i => `
      <div class="card ${i.lvl}">
        <h3>${esc(i.h)}</h3>
        <p class="mean">${i.mean}</p>
        ${rowsHtml(i.rows, i.collapseAll)}
        <div class="todo"><b>${esc(L.todoLabel)}</b>${esc(i.todo)}</div>
      </div>`;
    const doNow = q.filter(i => i.lvl !== 'fyi'), fyi = q.filter(i => i.lvl === 'fyi');
    if (doNow.length) H.push('<div class="cards">' + doNow.map(cardHtml).join('') + '</div>');
    if (fyi.length) {
      H.push(`<p class="sec">${esc(L.secFyi)}</p>`);
      H.push('<div class="cards">' + fyi.map(cardHtml).join('') + '</div>');
    }
  }

  // ── ③ 團隊負荷圖 ──
  H.push(`<p class="sec">${esc(L.secBg)}</p>`);
  H.push(loadChart(a));
  H.push(changesSection(d.changes));

  // ── ④ 摺疊細節（用人話命名）──
  const up = a.upcoming_releases || [];
  H.push(`<details><summary>${esc(L.dUpcoming)}<span class="tag">${esc(L.unitN(up.length))}</span></summary>
  <div class="body">
    ${a.release_pool_partial ? `<p class="w-txt">${esc(L.partialWarn)}</p>` : ''}
    <div class="scroll"><table>
    <tr><th>${esc(L.thDate)}</th><th>${esc(L.thName)}</th><th>${esc(L.thTeam)}</th><th>${esc(L.thStatus)}</th></tr>
    ${up.map(r => `<tr>
      <td style="white-space:nowrap">${esc(r.date)}<br><span class="thin" style="color:var(--dim)">${whenLabel(r.date, today)}</span></td>
      <td><a href="https://17media.atlassian.net/browse/${esc(r.key)}" target="_blank" rel="noopener">${esc(r.summary)}</a></td>
      <td>${esc(r.domain || L.noTeam)}</td>
      <td class="${statusCls(r.project_status) === 'r' ? 'r-txt' : statusCls(r.project_status) === 'w' ? 'w-txt' : ''}">${esc(zhStatus(r.project_status))}</td>
    </tr>`).join('') || `<tr><td colspan="4">${esc(L.none)}</td></tr>`}
  </table></div></div></details>`);

  H.push(`<details><summary>${esc(L.dStages)}<span class="tag">${esc(L.unitN((d.cards || []).length))}</span></summary>
  <div class="body"><table>
    <tr><th>${esc(L.thStage)}</th><th class="n">${esc(L.thCount)}</th></tr>
    ${['Discovery','Design','Develop','Impact'].filter(k => (a.stages || {})[k] != null)
      .map(k => `<tr><td>${esc(L.stage[k])}<span class="thin" style="color:var(--dim)"> ${k}</span></td>
                     <td class="n">${a.stages[k]}</td></tr>`).join('')}
  </table></div></details>`);

  H.push(`<details><summary>${esc(L.dAll)}<span class="tag">${esc(L.unitN((d.cards || []).length))}</span></summary>
  <div class="body"><div class="scroll"><table>
    <tr><th>${esc(L.thName)}</th><th>${esc(L.thTeam)}</th><th>${esc(L.thStage)}</th>
        <th>${esc(L.thStatus)}</th><th>${esc(L.thRelease)}</th></tr>
    ${(d.cards || []).map(c => `<tr>
      <td><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.summary)}</a>
          <span class="thin" style="color:var(--dim)">${idOf(c.key)}</span></td>
      <td>${esc(c.domain || L.noTeam)}</td>
      <td>${esc(L.stage[c.stage] || c.stage || '—')}</td>
      <td class="${statusCls(c.project_status) === 'r' ? 'r-txt' : statusCls(c.project_status) === 'w' ? 'w-txt' : ''}">${esc(zhStatus(c.project_status))}</td>
      <td>${esc(c.release_date || L.tbd)}</td></tr>`).join('')}
  </table></div></div></details>`);

  const dq = d.data_quality || [];
  H.push(`<details><summary>${esc(L.dSource)}<span class="tag">${
    dq.length ? esc(L.dqTag(dq.length).replace(/^ · /, '')) : esc(L.none)}</span></summary>
  <div class="body">
    <p>${esc(L.srcIntro)}</p>
    <table>
      <tr><td>${esc(L.srcSource)}</td><td>${esc(d.source || '—')}</td></tr>
      <tr><td>${esc(L.srcScope)}</td><td><code style="font-size:11.5px">${esc(d.jql || '—')}</code>
        ${(d.excluded_statuses || []).length ? `<br>${esc(L.srcExcl)}：${esc((d.excluded_statuses || []).join('、'))}` : ''}</td></tr>
      <tr><td>${esc(L.srcBase)}</td><td>${esc(L.srcBaseV((d.baseline || {}).locked_at || '—',
                                                          (d.baseline || {}).expires_at || '—'))}</td></tr>
      <tr><td>${esc(L.srcBasis)}</td><td>${esc(L.srcBasisV)}</td></tr>
    </table>
    ${dq.length ? `<p style="margin-top:14px">${esc(L.dqIntro)}</p>
    <div class="scroll"><table>
      <tr><th>${esc(L.thProject)}</th><th>${esc(L.thNote)}</th></tr>
      ${dq.map(x => `<tr><td>${esc((d.cards || []).find(c => c.key === x.key)?.summary || idOf(x.key))}</td>
        <td>${esc(x.issue)}${x.detail ? ` <span class="thin">${esc(x.detail)}</span>` : ''}</td></tr>`).join('')}
    </table></div>` : ''}
  </div></details>`);

  H.push(`<div class="foot">
    ${esc(L.footA)}<br>${esc(L.footB(SAME_DAY_ALERT, OK_BAND[1]))}<br>${esc(L.footC)}
  </div>`);

  document.getElementById('app').innerHTML = H.join('');

  document.querySelectorAll('.langs button').forEach(b =>
    b.addEventListener('click', () => setLang(b.dataset.lang)));
  document.getElementById('printbtn').addEventListener('click', () => window.print());
}

function setLang(v) {
  if (!I18N[v] || v === LANG) return;
  LANG = v; L = I18N[v]; saveLang(v);
  if (DATA) render(DATA);
}

// 列印時把所有摺疊區展開 —— 印出來的 PDF 不該有「點開才看得到」的東西。
// 印完再收回原狀，不改變螢幕上的狀態。
// null = 目前不在列印流程中。用 null 而不是空陣列，是為了分辨
// 「還沒展開過」與「展開過但當時全部本來就是開的」。
let reopened = null;
addEventListener('beforeprint', () => {
  // beforeprint 可能連續觸發兩次（部分瀏覽器與匯出 PDF 的工具會這樣）。
  // 不擋的話第二次會把 reopened 覆蓋成空陣列，afterprint 就收不回來，
  // 摺疊區從此永遠開著 —— 實測踩到過。
  if (reopened) return;
  reopened = [...document.querySelectorAll('details:not([open])')];
  reopened.forEach(d => d.open = true);
});
addEventListener('afterprint', () => {
  if (!reopened) return;
  reopened.forEach(d => d.open = false);
  reopened = null;
});

LANG = savedLang() || 'zh';
L = I18N[LANG];

// 絕對路徑，不是相對路徑 —— vercel.json 設了 trailingSlash:false，
// /roadmap-bot/web/ 會被導向 /roadmap-bot/web，此時 '../out/…' 會解析成
// /out/latest.json（錯的位置）。絕對路徑在三種 URL 形式下都正確。
fetch('/roadmap-bot/out/latest.json', { cache:'no-store' })
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(d => { DATA = d; render(d); })
  .catch(e => {
    document.getElementById('app').innerHTML = toolbar()
      + `<div class="err"><b>${esc(L.errH)}</b><br>${L.errB(esc(e.message))}</div>`;
    document.querySelectorAll('.langs button').forEach(b =>
      b.addEventListener('click', () => { setLang(b.dataset.lang); location.reload(); }));
    document.getElementById('printbtn').addEventListener('click', () => window.print());
  });
</script>
</body>
</html>
