<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>誰在處理這個痛點</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   痛點 → 負責的 Roadmap 卡（Cross 自己指定）

   設計前提：
   · 使用者 = Cross（COO，非工程師）。一句話任務：「這個痛點，誰在處理？」
   · 左邊挑痛點、右邊點卡片。點一下 = 指定，再點一下 = 取消。沒有 JSON、沒有 token、沒有 commit。
   · 自動儲存：停手 3 秒就存，右上角顯示「✓ 已儲存」。每次點擊都有「復原」。
   · 最需要處理的排最上面：有聲音但還沒人負責的痛點。
   · 狀態一律用人話：探索／設計中／開發中／已上線；正常／注意／有風險。
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#f6f7f9; --card:#ffffff; --line:#e3e6eb; --line2:#d3d8df;
  --tx:#1b1f24; --mut:#5d6672; --dim:#8a93a0;
  --acc:#2563eb; --acc-bg:#eef3ff;
  --red:#d92d20; --red-bg:#fdecea; --amb:#b54708; --amb-bg:#fef4e6; --grn:#067647; --grn-bg:#e7f6ee;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f1218; --card:#171b23; --line:#262c37; --line2:#333b48;
  --tx:#e8ebf0; --mut:#a2abb8; --dim:#6f7886;
  --acc:#6ea0ff; --acc-bg:#1b2740;
  --red:#ff7a6e; --red-bg:#3a1d1b; --amb:#ffb357; --amb-bg:#3a2a14; --grn:#55d39a; --grn-bg:#15332a;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.55}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hd h1{font-size:18px;margin:0;flex:1;min-width:220px}
.hd h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:2px}
.save{font-size:13px;color:var(--mut);white-space:nowrap}
.save.ok{color:var(--grn)} .save.err{color:var(--red)} .save.busy{color:var(--amb)}
.save button{border:1px solid var(--red);background:none;color:var(--red);border-radius:8px;padding:2px 10px;margin-left:6px;cursor:pointer}
.demo{background:var(--amb-bg);color:var(--amb);font-size:12.5px;text-align:center;padding:6px}
main{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}

/* ── 左：痛點清單 ── */
.side{display:flex;flex-direction:column;gap:6px}
.grp{font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 4px 2px}
.grp:first-child{margin-top:0}
.pain{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;cursor:pointer}
.pain:hover{border-color:var(--line2)}
.pain[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-bg)}
.pain .top{display:flex;justify-content:space-between;gap:10px}
.pain .t{font-size:14px;font-weight:500}
.pain .n{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mut)}
.pain .n b{color:var(--tx);font-size:14px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:7px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px}
.tag.none{background:var(--red-bg);color:var(--red)}
.tag.has{background:var(--grn-bg);color:var(--grn)}
.tag.quiet{background:var(--line);color:var(--mut)}

/* ── 右：負責的卡 ── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;position:sticky;top:84px}
.back{display:none;border:none;background:none;color:var(--acc);padding:0;margin-bottom:10px;cursor:pointer;font-size:14px}
.ptitle{font-size:20px;font-weight:600;margin:0}
.psub{font-size:13.5px;color:var(--mut);margin:4px 0 0}
.q{font-size:15px;font-weight:600;margin:22px 0 8px}
.picked{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border:1px dashed var(--line2);border-radius:12px}
.picked .empty{color:var(--dim);font-size:13.5px;align-self:center}
.pk{display:inline-flex;align-items:center;gap:8px;background:var(--acc-bg);border:1px solid var(--acc);border-radius:10px;padding:6px 6px 6px 11px;font-size:13px;max-width:100%}
.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk button{border:none;background:none;cursor:pointer;color:var(--mut);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.pk button:hover{background:var(--card);color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.tools input{flex:1;min-width:180px;border:1px solid var(--line2);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
.tools input:focus{outline:none;border-color:var(--acc)}
.chipf{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chipf[aria-pressed="true"]{background:var(--tx);color:var(--card);border-color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px 11px 40px;cursor:pointer;min-height:84px}
.tile:hover{border-color:var(--line2)}
.tile .box{position:absolute;left:12px;top:13px;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.tile[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg)}
.tile[aria-pressed="true"] .box{background:var(--acc);border-color:var(--acc)}
.tile .tt{font-size:13.5px;font-weight:500;line-height:1.4}
.tile .mm{font-size:12px;color:var(--mut);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.d-ok{background:var(--grn)} .d-warn{background:var(--amb)} .d-risk{background:var(--red)} .d-na{background:var(--dim)}
.also{font-size:11.5px;color:var(--dim);margin-top:4px}
.more{margin-top:14px;border:none;background:none;color:var(--acc);cursor:pointer;padding:4px 0;font-size:13.5px}
.nores{color:var(--dim);font-size:13.5px;padding:10px 2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--card);border-radius:12px;
  padding:10px 14px 10px 18px;font-size:14px;display:none;align-items:center;gap:14px;z-index:9;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{display:flex}
.toast button{border:none;background:none;color:var(--acc-bg);font-weight:600;cursor:pointer;text-decoration:underline}
.loading,.fatal{max-width:600px;margin:80px auto;text-align:center;color:var(--mut)}
.fatal{color:var(--red)}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:14px 14px 80px}
  body.detail .side{display:none} body:not(.detail) .panel{display:none}
  .panel{position:static;padding:16px} .back{display:block}
  header{padding:12px 14px}
}
</style>
</head>
<body>
<div id="root"><div class="loading">載入中…</div></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">復原</button></div>
<script>
// ── 資料來源：Apps Script 版用 google.script.run；原型版用內嵌的 window.__DEMO__ ──
const DEMO = !!window.__DEMO__;
const STAGE = {Discovery:'探索', Design:'設計中', Develop:'開發中', Impact:'已上線'};
const STATUS = {'On track':['正常','d-ok'], 'Warning':['注意','d-warn'], 'At Risk':['有風險','d-risk'], 'At risk':['有風險','d-risk'], 'Off track':['落後','d-risk']};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = k => k.replace('APPIDEAS-', '');

let D, map = {}, sel = null, team = '全部', q = '', showEnded = false;
let saveTimer = null, saveState = 'ok', savedAt = null, lastUndo = null, version = null;

function api(fn, ...args){
  if (DEMO) return Promise.resolve(fn === 'load' ? window.__DEMO__ : {ok:true, version:'demo'});
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn === 'load' ? 'loadEditorData' : 'saveMapping'](...args));
}

const cardsAll = () => [...D.cards.map(c => ({...c, ended:false})), ...D.left_cards.map(c => ({...c, ended:true, stage:c.last_stage}))];
const byKey = () => Object.fromEntries(cardsAll().map(c => [c.key, c]));
const painOf = code => D.pains.find(p => p.code === code);
const linked = code => map[code] || [];
const painsUsing = key => Object.keys(map).filter(c => map[c].includes(key));

function status(p){ return linked(p.code).length ? 'has' : p.latest >= 10 ? 'none' : 'quiet'; }

function renderSide(){
  const max = Math.max(...D.pains.map(p => p.latest), 1);
  const groups = [
    ['none', '有聲音，還沒指定誰負責'],
    ['has',  '已指定負責的卡'],
    ['quiet','聲音少（每週不到 10 位主播）']
  ];
  return groups.map(([st, label]) => {
    const list = D.pains.filter(p => status(p) === st).sort((a, b) => b.latest - a.latest || b.voc_score - a.voc_score);
    if (!list.length) return '';
    return `<div class="grp">${label}（${list.length}）</div>` + list.map(p => {
      const n = linked(p.code).length;
      return `<button class="pain" data-pain="${esc(p.code)}" aria-current="${sel === p.code}">
        <div class="top"><span class="t">${esc(p.title)}</span><span class="n"><b>${p.latest}</b> 人</span></div>
        <div class="bar"><i style="width:${Math.round(p.latest / max * 100)}%"></i></div>
        ${st === 'none' ? '<span class="tag none">還沒有人負責</span>' : st === 'has' ? `<span class="tag has">${n} 張卡處理中</span>` : '<span class="tag quiet">聲音少</span>'}
      </button>`;
    }).join('');
  }).join('');
}

function tile(c){
  const on = linked(sel).includes(c.key);
  const [st, dot] = c.ended ? ['已結束', 'd-na'] : (STATUS[c.project_status] || ['未標', 'd-na']);
  const others = painsUsing(c.key).filter(x => x !== sel);
  return `<button class="tile" data-card="${esc(c.key)}" aria-pressed="${on}">
    <span class="box">${on ? '✓' : ''}</span>
    <div class="tt">${esc(c.summary)}</div>
    <div class="mm"><span>#${esc(num(c.key))}</span>${c.domain ? `<span>${esc(c.domain)}</span>` : ''}
      <span>${c.ended ? '已結束（' + esc(c.last_seen) + '）' : esc(STAGE[c.stage] || c.stage)}</span>
      ${c.ended ? '' : `<span><i class="dot ${dot}"></i>${st}</span>`}</div>
    ${others.length ? `<div class="also">也負責：${others.map(o => esc(painOf(o)?.title || o)).join('、')}</div>` : ''}
  </button>`;
}

function renderPanel(){
  if (!sel) return `<p class="psub">← 從左邊選一個痛點，再點選負責處理它的 Roadmap 卡。</p>`;
  const p = painOf(sel), K = byKey();
  const picks = linked(sel);
  const ql = q.trim().toLowerCase();
  const teams = ['全部', ...new Set(D.cards.map(c => c.domain).filter(Boolean))];
  const fit = c => (team === '全部' || c.domain === team) && (!ql || c.summary.toLowerCase().includes(ql) || num(c.key).includes(ql));
  const live = cardsAll().filter(c => !c.ended && fit(c));
  const ended = cardsAll().filter(c => c.ended && fit(c));
  const delta = p.delta_pct == null ? '' : `（比前一週 ${p.delta_pct > 0 ? '+' : ''}${Math.round(p.delta_pct * 100)}%）`;
  return `<button class="back" data-back>← 所有痛點</button>
    <h2 class="ptitle">${esc(p.title)}</h2>
    <p class="psub">最新一週 <b>${p.latest}</b> 位主播提到${delta}　·　VoC 分數 ${p.voc_score}</p>
    <div class="q">誰在處理這個痛點？</div>
    <div class="picked">${picks.length ? picks.map(k => `<span class="pk"><span>#${esc(num(k))} ${esc(K[k]?.summary || '（不在目前的 Roadmap 清單）')}</span><button data-rm="${esc(k)}" aria-label="取消">×</button></span>`).join('')
      : '<span class="empty">還沒指定。點下面的卡片就會加進來 👇</span>'}</div>
    <div class="q">Roadmap 上的卡</div>
    <div class="tools"><input id="q" type="search" placeholder="搜尋卡名或卡號" value="${esc(q)}" aria-label="搜尋卡片">
      ${teams.map(t => `<button class="chipf" data-team="${esc(t)}" aria-pressed="${team === t}">${esc(t)}</button>`).join('')}</div>
    <div class="tiles">${live.map(tile).join('') || '<div class="nores">沒有符合的卡</div>'}</div>
    ${ended.length ? `<button class="more" data-ended>${showEnded ? '▾ 收起' : '▸ 也顯示'}最近 4 個月已結束的卡（${ended.length} 張，多半已上線）</button>
      ${showEnded ? `<div class="tiles" style="margin-top:8px">${ended.map(tile).join('')}</div>` : ''}` : ''}`;
}

function saveLabel(){
  if (DEMO) return '<span class="save busy">原型：點選不會真的儲存</span>';
  if (saveState === 'busy') return '<span class="save busy">儲存中…</span>';
  if (saveState === 'dirty') return '<span class="save busy">準備儲存…</span>';
  if (saveState === 'err') return '<span class="save err">⚠ 儲存失敗<button data-retry>重試</button></span>';
  return `<span class="save ok">✓ 已儲存${savedAt ? '　' + savedAt : ''}</span>`;
}

function render(keepFocus){
  const assigned = D.pains.filter(p => linked(p.code).length).length;
  const gaps = D.pains.filter(p => status(p) === 'none').length;
  document.body.classList.toggle('detail', !!sel);
  document.getElementById('root').innerHTML =
    (DEMO ? '<div class="demo">這是原型：資料是真的（' + esc(D.as_of) + '），但點選不會存檔。確認好用後再接上儲存。</div>' : '') +
    `<header><div class="hd"><h1>誰在處理這個痛點？<small>25 個痛點：<b>${assigned}</b> 個已指定負責的卡　·　<b style="color:var(--red)">${gaps}</b> 個有聲音但還沒人負責</small></h1>
      <span id="save">${saveLabel()}</span></div></header>
     <main><nav class="side" aria-label="痛點">${renderSide()}</nav><section class="panel">${renderPanel()}</section></main>`;
  if (keepFocus){ const i = document.getElementById('q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}

function toggle(key){
  const cur = new Set(linked(sel)), was = cur.has(key);
  was ? cur.delete(key) : cur.add(key);
  const code = sel;
  map[code] = [...cur]; if (!map[code].length) delete map[code];
  lastUndo = () => { const s = new Set(linked(code)); was ? s.add(key) : s.delete(key); map[code] = [...s]; if (!map[code].length) delete map[code]; queueSave(); render(); };
  const c = byKey()[key];
  toast(`${was ? '已取消' : '已指定'}：#${num(key)} ${c ? c.summary.slice(0, 40) : ''}`);
  queueSave(); render();
}

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg; t.classList.add('on');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 5000);
}

function queueSave(){
  if (DEMO) return;
  saveState = 'dirty'; document.getElementById('save') && (document.getElementById('save').innerHTML = saveLabel());
  clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 3000);
}
async function doSave(){
  saveState = 'busy'; document.getElementById('save').innerHTML = saveLabel();
  try {
    const r = await api('save', JSON.stringify(map), version);
    if (!r.ok) throw new Error(r.message || '儲存失敗');
    version = r.version; saveState = 'ok';
    savedAt = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});
  } catch(e){ saveState = 'err'; toast('儲存失敗：' + (e.message || e)); }
  document.getElementById('save').innerHTML = saveLabel();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pain],[data-card],[data-rm],[data-team],[data-ended],[data-back],[data-retry],#undo');
  if (!t) return;
  if (t.id === 'undo'){ if (lastUndo){ lastUndo(); lastUndo = null; } document.getElementById('toast').classList.remove('on'); return; }
  if (t.dataset.pain){ sel = t.dataset.pain; q = ''; render(); window.scrollTo({top:0}); }
  else if (t.dataset.card) toggle(t.dataset.card);
  else if (t.dataset.rm) toggle(t.dataset.rm);
  else if (t.dataset.team){ team = t.dataset.team; render(); }
  else if (t.dataset.ended !== undefined){ showEnded = !showEnded; render(); }
  else if (t.dataset.back !== undefined){ sel = null; render(); }
  else if (t.dataset.retry !== undefined) doSave();
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ q = e.target.value; render(true); } });
window.addEventListener('beforeunload', e => { if (saveState === 'dirty' || saveState === 'busy'){ e.preventDefault(); e.returnValue = ''; } });

api('load').then(d => {
  D = d; map = d.mapping || {}; version = d.version || null;
  const first = D.pains.filter(p => status(p) === 'none').sort((a, b) => b.latest - a.latest)[0];
  if (first && window.innerWidth > 820) sel = first.code;
  render();
}).catch(e => { document.getElementById('root').innerHTML = `<div class="fatal">載入失敗：${esc(e.message || e)}</div>`; });
</script>
</body>
</html>
