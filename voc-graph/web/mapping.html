<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>誰在處理這個痛點</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#f6f7f9;color:#1b1f24;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.6}
@media (prefers-color-scheme: dark){body{background:#0f1218;color:#e8ebf0}}
.box{max-width:460px;text-align:center}
a{color:#2563eb}
</style>
</head>
<body>
<!-- 編輯頁已搬到 Apps Script（用 Google 帳號開、不用 token）。這頁只負責轉過去。
     網址由 Editor.gs 第一次存檔時寫進 mapping.json 的 _editor_url。 -->
<div class="box" id="box">轉到編輯頁中…</div>
<script>
fetch('/voc-graph/mapping.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(m => {
    if (m._editor_url && /^https:\/\/script\.google\.com\//.test(m._editor_url)) location.replace(m._editor_url);
    else throw new Error('no url');
  })
  .catch(() => {
    document.getElementById('box').innerHTML =
      '編輯頁現在放在你的 Apps Script（用 Google 帳號開，不用 token）。<br>' +
      '請打開你存的書籤「誰在處理這個痛點」。<br><br>' +
      '還沒設定？步驟在 repo 的 <code>voc-graph/gas/README.md</code>「編輯頁」那一段。';
  });
</script>
</body>
</html>
