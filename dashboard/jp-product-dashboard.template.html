<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>JP Product Dashboard</title>
<style>
:root{
  --ink:#1a1d21; --ink2:#5a6472; --ink3:#9ba3ae;
  --paper:#f6f7f9; --card:#ffffff; --line:#e3e6ea;
  --live:#e5484d; --green:#2f9e6e; --amber:#e5a13a; --red:#e5484d; --gray:#c3c9d0;
  --green-bg:#e7f5ee; --amber-bg:#fbf1de; --red-bg:#fdeaea; --gray-bg:#eef0f3;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","PingFang TC","Noto Sans CJK TC","Yu Gothic UI","Meiryo",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 64px}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hd h1{font-size:17px;font-weight:800;letter-spacing:.02em}
.hd .sub{font-size:12px;color:var(--ink2)}
.hd .spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.updated{font-size:12px;color:var(--ink3);font-family:var(--mono)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 16px;font-size:14px;font-weight:700;
  color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  font-family:inherit;white-space:nowrap}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button .tc{display:inline-block;margin-left:7px;font-size:11.5px;font-weight:700;color:var(--ink3);
  background:var(--gray-bg);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tabs button.on .tc{background:var(--ink);color:#fff}
/* ---------- roadmap tab ---------- */
.rm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.rm-stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.rm-stat .n{font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.rm-stat .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
.rm-stat.alert .n{color:var(--red)}
.rm-stat.good .n{color:var(--green)}
.rm-note{font-size:12.5px;color:var(--ink2);margin:14px 2px 0;line-height:1.6}
.rm-sec{margin-top:26px}
.rm-tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.rm-tbl th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);
  font-weight:800;padding:9px 14px;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap}
.rm-tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.rm-tbl tr:last-child td{border-bottom:0}
.rm-tbl tbody tr:hover{background:var(--paper)}
.rm-tbl a.k{color:var(--ink);text-decoration:none;font-weight:700;font-size:12.5px;white-space:nowrap;
  font-family:var(--mono)}
.rm-tbl a.k:hover{text-decoration:underline}
.rm-tbl td.it{font-weight:600;min-width:200px}
.rm-tbl td.dt{font-size:13.5px;min-width:125px}
.rm-tbl tr.hl td.dt{color:var(--green);font-weight:800}
.rm-tbl td.ow{color:var(--ink2);font-size:13px;white-space:nowrap}
.rm-tbl td.rk{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono)}
.rm-pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 10px;white-space:nowrap}
.rm-pill.done{color:#1d6b4c;background:var(--green-bg)}
.rm-pill.dev{color:#1a4f7a;background:#e6f0f8}
.rm-pill.design{color:#8a5d12;background:var(--amber-bg)}
.rm-pill.park{color:#5a6472;background:var(--gray-bg)}
.rm-pri{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 7px;font-family:var(--mono)}
.rm-pri.P0{color:#a5252a;background:var(--red-bg)}
.rm-pri.P1{color:#8a5d12;background:var(--amber-bg)}
.rm-pri.P2{color:#1a4f7a;background:#e6f0f8}
.rm-pri.P3{color:#5a6472;background:var(--gray-bg)}
.rm-band{background:var(--red-bg);border:1px solid #f5c9c9;border-radius:9px;padding:11px 14px;
  font-size:13px;color:#a5252a;margin-top:10px;line-height:1.55}
.rm-notes{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 20px;margin-top:10px}
.rm-notes li{font-size:13.5px;color:var(--ink2);margin:11px 0 11px 4px;line-height:1.6}
.rm-notes li b{color:var(--ink)}
.rm-empty{font-size:13.5px;color:var(--ink3);padding:18px 2px}
@media (max-width:820px){
  .rm-stats{grid-template-columns:repeat(2,1fr)}
  .rm-tbl{display:block;overflow-x:auto;white-space:nowrap}
  .rm-tbl td.it{white-space:normal}
}
/* ---------- search ---------- */
.searchbar{margin:18px 0 0;display:flex;gap:10px;align-items:center}
.searchbar input{flex:1;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
.searchbar input:focus{border-color:var(--ink2)}
.searchbar .clr{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2);display:none}
.s-count{font-size:12.5px;color:var(--ink2);margin:10px 2px 0}
/* ---------- filter bar ---------- */
.filterbar{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.f-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f-lb{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);width:56px;flex-shrink:0}
.f-chip{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);cursor:pointer;white-space:nowrap}
.f-chip:hover{border-color:var(--ink3)}
.f-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f-chip.on.h-red{background:var(--red);border-color:var(--red)}
.f-chip.on.h-amber{background:var(--amber);border-color:var(--amber)}
.f-chip.on.h-green{background:var(--green);border-color:var(--green)}
.f-urgent{font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px;border:1px solid var(--red);background:var(--red-bg);color:var(--red);cursor:pointer;white-space:nowrap}
.f-urgent.on{background:var(--red);color:#fff}
.f-spacer{flex:1}
.f-sort{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.f-clear{font-size:12px;font-weight:700;color:var(--ink3);background:none;border:0;cursor:pointer;text-decoration:underline;white-space:nowrap}
.f-count{font-size:12.5px;color:var(--ink2);padding-top:2px}
.f-empty{padding:24px 16px;text-align:center;font-size:13px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px}
@media(max-width:640px){.f-lb{width:100%}}
/* ---------- sections ---------- */
section{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sec-h .cnt{font-family:var(--mono);font-size:12px;color:var(--ink3)}
/* ---------- ON AIR inbox ---------- */
.onair{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--live);border-radius:10px;overflow:hidden}
.onair-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.onair-h .t{font-weight:800;font-size:14px;letter-spacing:.06em}
.onair-item{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.onair-item:last-child{border-bottom:0}
.onair-item .k{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap;padding-top:2px}
.onair-item .w{flex:1;min-width:220px;font-size:14px}
.onair-item .d{font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:2px}
.onair-item a.go{font-size:12px;font-weight:700;color:var(--live);text-decoration:none;white-space:nowrap;padding-top:2px}
.onair-empty{padding:14px 16px;font-size:13px;color:var(--ink2)}
/* ---------- overview ---------- */
.ov{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.ov p{font-size:14.5px;max-width:74ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;font-family:var(--mono)}
.c-green{background:var(--green-bg);color:var(--green)} .c-amber{background:var(--amber-bg);color:#9a6a1a}
.c-red{background:var(--red-bg);color:var(--red)} .c-gray{background:var(--gray-bg);color:var(--ink2)}
/* ---------- heatmap ---------- */
.hm-scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:560px;overflow-y:auto}
table.hm{border-collapse:collapse;width:100%;min-width:640px}
.hm th{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.hm th:first-child{text-align:left;padding-left:16px}
.hm td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
.hm tr:last-child td{border-bottom:0}
.hm td.name{text-align:left;padding-left:16px;font-size:13.5px;font-weight:600;max-width:280px}
.hm td.name .k{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:400}
.cell{display:inline-block;width:34px;height:20px;border-radius:5px}
.cell.g{background:var(--green)} .cell.a{background:var(--amber)} .cell.r{background:var(--red)} .cell.x{background:var(--gray-bg)}
.hm td.why{font-size:12px;color:var(--ink2);text-align:left;max-width:240px}
/* ---------- timeline ---------- */
.tl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative}
.tl-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tl-row:last-child{margin-bottom:0}
.tl-name{width:190px;min-width:120px;font-size:12.5px;font-weight:600;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{flex:1;height:16px;background:var(--gray-bg);border-radius:8px;position:relative;overflow:visible}
.tl-fill{position:absolute;top:0;height:100%;border-radius:8px}
.tl-tick{position:absolute;top:-3px;width:2px;height:22px;background:var(--ink3);opacity:.5}
.tl-today{position:absolute;top:-6px;width:2px;height:28px;background:var(--live)}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:10px;padding-left:202px}
.tl-legend{font-size:11.5px;color:var(--ink3);margin-top:8px;padding-left:202px}
@media(max-width:640px){.tl-name{width:96px}.tl-axis,.tl-legend{padding-left:108px}}
/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .k{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.card h3{font-size:15.5px;font-weight:800;line-height:1.35}
.pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-left:auto}
.p-green{background:var(--green-bg);color:var(--green)} .p-amber{background:var(--amber-bg);color:#9a6a1a} .p-red{background:var(--red-bg);color:var(--red)} .p-gray{background:var(--gray-bg);color:var(--ink2)}
.card .row{font-size:13.5px}
.card .row .lb{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.card .hw{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}
.card a.jl{font-size:12px;font-weight:700;color:var(--ink2);text-decoration:none}
.card a.jl:hover{color:var(--ink)}
/* ---------- parked ---------- */
details.parked{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:10px}
details.parked summary{cursor:pointer;font-size:14px;font-weight:800;color:var(--ink2);padding:14px 16px;letter-spacing:.04em}
details.parked summary .cnt{font-family:var(--mono);font-weight:400;color:var(--ink3)}
.parked-note{font-size:12.5px;color:var(--ink2);padding:0 16px 10px;border-bottom:1px solid var(--line)}
.parked-list{max-height:520px;overflow-y:auto}
.prow{display:flex;gap:12px;align-items:baseline;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .k{font-family:var(--mono);font-size:11.5px;color:var(--ink3);white-space:nowrap;min-width:118px}
.prow .t{font-weight:600}
.prow .i{color:var(--ink2);font-size:12.5px;flex-basis:100%;padding-left:130px}
@media(max-width:640px){.prow .i{padding-left:0}}
.prow .d{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.prow a.go{font-size:12px;font-weight:700;color:var(--ink3);text-decoration:none;margin-left:auto;white-space:nowrap}
.prow a.go:hover{color:var(--ink)}
/* ---------- footer ---------- */
footer{margin-top:36px;font-size:11.5px;color:var(--ink3);line-height:1.7}
</style>
</head>
<body>

<header><div class="hd">
  <div><h1>JP Product Dashboard</h1><div class="sub" id="subT"></div></div>
  <div class="spacer"></div>
  <div class="seg">
    <button id="lz" onclick="setLang('zh')">中</button>
    <button id="le" onclick="setLang('en')">EN</button>
    <button id="lj" onclick="setLang('ja')">日</button>
  </div>
  <span class="updated" id="upd"></span>
</div></header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button id="tabOv" role="tab" onclick="setTab('overview')"></button>
    <button id="tabRm" role="tab" onclick="setTab('roadmap')"></button>
  </div>

  <div class="searchbar">
    <input id="q" type="search" autocomplete="off">
    <button class="clr" id="qClr" onclick="clearSearch()"></button>
  </div>

  <section id="s-roadmap" style="display:none">
    <div class="rm-stats" id="rmStats"></div>
    <div class="rm-note" id="rmNote"></div>
    <div id="rmGroups"></div>
    <div class="rm-sec">
      <div class="sec-h"><h2 id="rmUnT"></h2><span class="cnt" id="rmUnC"></span></div>
      <div class="rm-band" id="rmUnDesc"></div>
      <table class="rm-tbl">
        <thead><tr><th id="rmThRank"></th><th id="rmThPri"></th><th id="rmThItem"></th></tr></thead>
        <tbody id="rmUnBody"></tbody>
      </table>
    </div>
    <div class="rm-sec">
      <div class="sec-h"><h2 id="rmNoteT"></h2></div>
      <div class="rm-notes"><ul id="rmNoteBody"></ul></div>
    </div>
  </section>

  <section id="s-search" style="display:none">
    <div class="s-count" id="sCount"></div>
    <div class="cards" id="sCards" style="margin-top:12px"></div>
    <div id="sParkedWrap" style="margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden">
      <div class="parked-note" id="sParkedT" style="padding:12px 16px 10px"></div>
      <div id="sParked"></div>
    </div>
  </section>

  <div id="main">
  <section id="s-onair">
    <div class="onair">
      <div class="onair-h"><span class="dot"></span><span class="t" id="onairT"></span></div>
      <div id="onairList"></div>
    </div>
  </section>

  <section id="s-ov">
    <div class="sec-h"><h2 id="ovT"></h2></div>
    <div class="ov"><p id="ovP"></p><div class="chips" id="ovChips"></div></div>
  </section>

  <section id="s-filter">
    <div class="filterbar">
      <div class="f-row">
        <span class="f-lb" id="fHealthLb"></span>
        <button class="f-urgent" id="fUrgent" onclick="toggleUrgent()"></button>
        <div id="fHealthChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div class="f-row">
        <span class="f-lb" id="fStageLb"></span>
        <div id="fStageChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </div>
      <div class="f-row">
        <span class="f-count" id="fCount"></span>
        <button class="f-clear" id="fClear" onclick="clearFilters()" style="display:none"></button>
        <div class="f-spacer"></div>
        <select class="f-sort" id="fSort" onchange="setSort(this.value)">
          <option id="soHealth" value="health">·</option>
          <option id="soUpdated" value="updated">·</option>
          <option id="soKey" value="key">·</option>
        </select>
      </div>
    </div>
  </section>

  <section id="s-hm">
    <div class="sec-h"><h2 id="hmT"></h2><span class="cnt" id="hmC"></span></div>
    <div class="hm-scroll"><table class="hm"><thead><tr id="hmHead"></tr></thead><tbody id="hmBody"></tbody></table></div>
    <div class="f-empty" id="hmEmpty" style="display:none"></div>
  </section>

  <section id="s-tl">
    <div class="sec-h"><h2 id="tlT"></h2><span class="cnt" id="tlC"></span></div>
    <div class="tl" id="tlBox"></div>
  </section>

  <section id="s-cards">
    <div class="sec-h"><h2 id="cdT"></h2><span class="cnt" id="cdC"></span></div>
    <div class="cards" id="cards"></div>
    <div class="f-empty" id="cdEmpty" style="display:none"></div>
  </section>

  <details class="parked" id="s-parked">
    <summary><span id="pkT"></span> <span class="cnt" id="pkC"></span></summary>
    <div class="parked-note" id="pkNote"></div>
    <div class="parked-list" id="pkList"></div>
  </details>
  </div>

  <footer id="foot"></footer>
</div>

<script>
/* =========================================================
   JP Product Dashboard v2 — static snapshot, data baked in.
   No network calls, no storage: everything below runs offline.
   Regenerate via the repo pipeline (see footer / REFRESH.md).
========================================================= */

var DATA = __PAYLOAD_JSON__;
var ROADMAP = __ROADMAP_JSON__;

var STAGE_KEYS = ['stg0','stg1','stg2','stg3','stg4'];
var HEALTH_ORDER = {red:0, amber:1, green:2, gray:3};

/* ---------------- i18n ---------------- */
var I18N = {
  zh:{sub:'給非工程人員的白話進度板 — 資料來自 JIRA',updated:'快照',
      search:'搜尋:輸入票號(例 1927)或關鍵字(中/英/日皆可)',clear:'清除',
      sFound:'找到 {a} 個進行中的功能、{p} 個停車場點子',sNone:'找不到符合的票。換個關鍵字試試(可用中文、英文、日文或票號)。',
      sParked:'停車場裡符合的點子',
      onair:'需要 Cross 的事',onairNone:'目前沒有等你的事。',open:'開票 →',
      ov:'總覽',hm:'進度熱圖',tl:'時間軸',cd:'各功能白話說明',feature:'功能',

/* ---------------- state ---------------- */
var state = { lang:'zh', q:'', sort:'health', tab:'overview', filters:{health:null, stage:null} };

/* ---------------- utils ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function T(k){ return (I18N[state.lang]&&I18N[state.lang][k]) || I18N.zh[k] || k; }
function F(k,vars){ var s=T(k); Object.keys(vars||{}).forEach(function(v){ s=s.replace('{'+v+'}',vars[v]); }); return s; }
function pick(obj){ if(!obj) return ''; return obj[state.lang] || obj.zh || obj.en || ''; }
function fmtDate(iso){ if(!iso) return '—'; return String(iso).slice(5,10).replace('-','/'); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function healthPill(h){ return (h==='red')?'p-red':(h==='amber')?'p-amber':(h==='green')?'p-green':'p-gray'; }
function keyNum(k){ return parseInt(String(k).split('-')[1],10)||0; }
function sortTickets(a,b,mode){
  mode = mode || 'health';
  if(mode==='updated'){ return (a.updated||'')<(b.updated||'') ? 1 : ((a.updated||'')>(b.updated||'') ? -1 : 0); }
  if(mode==='key'){ return keyNum(a.key)-keyNum(b.key); }
  var d=(HEALTH_ORDER[a.health]!==undefined?HEALTH_ORDER[a.health]:3)-(HEALTH_ORDER[b.health]!==undefined?HEALTH_ORDER[b.health]:3);
  if(d)return d;
  d=(b.stage||0)-(a.stage||0); if(d)return d;
  return a.key<b.key?1:-1;
}
function ticketMatchesFilters(t){
  var hf=state.filters.health;
  if(hf==='urgent'){ if(t.health!=='red'&&t.health!=='amber') return false; }
  else if(hf && t.health!==hf){ return false; }
  if(state.filters.stage!==null && t.stage!==state.filters.stage){ return false; }
  return true;
}
function setHealthFilter(v){ state.filters.health=v; render(); }
function toggleUrgent(){ state.filters.health=(state.filters.health==='urgent')?null:'urgent'; render(); }
function setStageFilter(v){ state.filters.stage=v; render(); }
function setSort(v){ state.sort=v; render(); }
function clearFilters(){ state.filters={health:null, stage:null}; render(); }

function renderFilterBar(all){
  var hc={green:0,amber:0,red:0,gray:0}, sc=[0,0,0,0,0];
  all.forEach(function(t){ hc[t.health||'gray']=(hc[t.health||'gray']||0)+1; sc[Math.min(Math.max(t.stage||0,0),4)]++; });
  $('fHealthLb').textContent=T('fHealth');
  $('fStageLb').textContent=T('fStage');
  var hf=state.filters.health;
  function chip(label,val,cls,cnt){
    var on=(hf===val);
    return '<button class="f-chip'+(on?' on':'')+(on&&cls?(' '+cls):'')+'" onclick="setHealthFilter('+(val===null?'null':("'"+val+"'"))+')">'+esc(label)+' ('+cnt+')</button>';
  }
  $('fHealthChips').innerHTML =
    chip(T('fAll'), null, '', all.length)
    + chip(T('red'), 'red', 'h-red', hc.red)
    + chip(T('amber'), 'amber', 'h-amber', hc.amber)
    + chip(T('green'), 'green', 'h-green', hc.green)
    + chip(T('gray'), 'gray', '', hc.gray);
  $('fUrgent').textContent = T('fUrgent')+' ('+(hc.red+hc.amber)+')';
  $('fUrgent').className = 'f-urgent'+(hf==='urgent'?' on':'');
  var sf=state.filters.stage;
  function schip(label,val,cnt){
    var on=(sf===val);
    return '<button class="f-chip'+(on?' on':'')+'" onclick="setStageFilter('+(val===null?'null':val)+')">'+esc(label)+' ('+cnt+')</button>';
  }
  var sh='';
  sh+=schip(T('fAll'), null, all.length);
  for(var i=0;i<5;i++) sh+=schip(T(STAGE_KEYS[i]), i, sc[i]);
  $('fStageChips').innerHTML=sh;

  $('fClear').style.display=(hf!==null||sf!==null)?'':'none';
  $('fClear').textContent=T('fClear');
  $('soHealth').textContent=T('sortHealth');
  $('soUpdated').textContent=T('sortUpdated');
  $('soKey').textContent=T('sortKey');
  $('fSort').value=state.sort;
}

/* ---------------- render ---------------- */
function setLang(l){ state.lang=l; render(); }
function setTab(t){ state.tab=t; render(); }

/* ---------------- roadmap tab ---------------- */
function rmPill(gid){
  return gid==='released' ? 'done'
       : (gid==='august'||gid==='sept1'||gid==='late') ? 'dev'
       : gid==='design' ? 'design' : 'park';
}
function rmHay(it,g){
  return [it.key||'', it.owner||'',
          (it.title&&(it.title[state.lang]||it.title.zh))||'',
          (it.status&&(it.status[state.lang]||it.status.zh))||'',
          (it.date&&(it.date[state.lang]||it.date.zh))||'',
          (g&&g.label&&(g.label[state.lang]||g.label.zh))||'',
          it.zh||'', it.en||'', it.ja||''].join(' ').toLowerCase();
}
function renderRoadmap(){
  var R=ROADMAP, q=state.q.trim().toLowerCase();
  var st=R.stats||{};
  $('rmStats').innerHTML=[
    ['',st.total_requests,T('rmTotal')],
    ['',st.ticketed,T('rmTicketed')],
    ['good',st.with_release_date,T('rmDated')],
    ['alert',st.untracked,T('rmUntracked')]
  ].map(function(r){
    return '<div class="rm-stat '+r[0]+'"><div class="n">'+esc(r[1])+'</div><div class="l">'+esc(r[2])+'</div></div>';
  }).join('');
  $('rmNote').textContent=T('rmNote');

  var out='';
  (R.groups||[]).forEach(function(g){
    var rows=(g.items||[]).filter(function(it){ return !q || rmHay(it,g).indexOf(q)>=0; });
    if(!rows.length) return;
    out+='<div class="rm-sec"><div class="sec-h"><h2>'+esc(g.icon+' '+pick(g.label))+'</h2>'
       + '<span class="cnt">'+rows.length+'</span></div>'
       + '<table class="rm-tbl"><thead><tr><th>'+esc(T('rmKey'))+'</th><th>'+esc(T('rmItem'))
       + '</th><th>'+esc(T('rmDate'))+'</th><th>'+esc(T('rmStatus'))+'</th><th>'+esc(T('rmOwner'))
       + '</th></tr></thead><tbody>';
    rows.forEach(function(it){
      out+='<tr'+(it.highlight?' class="hl"':'')+'>'
        + '<td><a class="k" href="'+esc(R.meta.jira_base+it.key)+'" target="_blank" rel="noopener">'+esc(it.key)+'</a></td>'
        + '<td class="it">'+esc(pick(it.title))+'</td>'
        + '<td class="dt">'+esc(pick(it.date))+'</td>'
        + '<td><span class="rm-pill '+rmPill(g.id)+'">'+esc(pick(it.status))+'</span></td>'
        + '<td class="ow">'+esc(it.owner||'—')+'</td></tr>';
    });
    out+='</tbody></table></div>';
  });
  $('rmGroups').innerHTML=out||'<div class="rm-empty">'+esc(T('rmNone'))+'</div>';

  $('rmUnT').textContent=T('rmUnT');
  $('rmUnDesc').textContent=T('rmUnDesc');
  $('rmThRank').textContent=T('rmRank');
  $('rmThPri').textContent=T('rmPri');
  $('rmThItem').textContent=T('rmItem');
  var un=(R.untracked||[]).filter(function(it){ return !q || rmHay(it,null).indexOf(q)>=0; });
  $('rmUnC').textContent=un.length;
  $('rmUnBody').innerHTML=un.length
    ? un.map(function(it){
        return '<tr><td class="rk">#'+esc(it.rank)+'</td>'
             + '<td><span class="rm-pri '+esc(it.p)+'">'+esc(it.p)+'</span></td>'
             + '<td class="it">'+esc(it[state.lang]||it.zh)+'</td></tr>'; }).join('')
    : '<tr><td colspan="3" class="rm-empty">'+esc(T('rmNone'))+'</td></tr>';

  $('rmNoteT').textContent=T('rmNoteT');
  $('rmNoteBody').innerHTML=(R.notes||[]).map(function(n){
    return '<li>'+(n[state.lang]||n.zh)+'</li>'; }).join('');
}

/* Decide which of the three views is visible, for the current tab + query. */
function applyView(){
  var q=state.q.trim().toLowerCase(), rm=(state.tab==='roadmap');
  $('s-roadmap').style.display = rm ? '' : 'none';
  $('s-search').style.display  = (!rm && q) ? '' : 'none';
  $('main').style.display      = (!rm && !q) ? '' : 'none';
  $('qClr').style.display      = q ? '' : 'none';
  /* the footer describes the overview's ticket scope, so it would contradict the roadmap counts */
  $('foot').style.display      = rm ? 'none' : '';
  if(rm) renderRoadmap();
  else if(q) renderSearchResults();
}

function render(){
  var d=DATA, L=state.lang;
  var allTickets=(d.tickets||[]).slice();
  var tickets=allTickets.slice().sort(function(a,b){return sortTickets(a,b,'health');});
  var filtered=allTickets.filter(ticketMatchesFilters).sort(function(a,b){return sortTickets(a,b,state.sort);});
  var parked=d.parked||[];
  $('lz').className=(L==='zh')?'on':''; $('le').className=(L==='en')?'on':''; $('lj').className=(L==='ja')?'on':'';
  var rmCount=(ROADMAP.stats&&ROADMAP.stats.total_requests)||0;
  $('tabOv').innerHTML=esc(T('tabOv'))+'<span class="tc">'+(allTickets.length)+'</span>';
  $('tabRm').innerHTML=esc(T('tabRm'))+'<span class="tc">'+rmCount+'</span>';
  $('tabOv').className=(state.tab==='overview')?'on':'';
  $('tabRm').className=(state.tab==='roadmap')?'on':'';
  $('subT').textContent=T('sub');
  $('upd').textContent=T('updated')+' '+String(d.generatedAt).slice(0,16).replace('T',' ');
  $('q').placeholder=T('search');
  $('qClr').textContent=T('clear');

  /* ON AIR */
  $('onairT').textContent=T('onair');
  var needs=tickets.filter(function(t){return t.needsCross&&t.needsCross.flag;});
  var oh='';
  if(!needs.length){ oh='<div class="onair-empty">'+esc(T('onairNone'))+'</div>'; }
  else{
    needs.forEach(function(t){
      oh+='<div class="onair-item"><span class="k">'+esc(t.key)+'</span>'
        +'<span class="w"><b>'+esc(pick(t.title))+'</b> — '+esc(pick(t.needsCross.why))+'</span>'
        +'<span class="d">'+esc(fmtDate(t.needsCross.date))+'</span>'
        +'<a class="go" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(T('open'))+'</a></div>';
    });
  }
  $('onairList').innerHTML=oh;
  document.title=(needs.length?('('+needs.length+') '):'')+'JP Product Dashboard';

  /* overview */
  $('ovT').textContent=T('ov');
  $('ovP').textContent=pick(d.roadmap)||'';
  var cnt={green:0,amber:0,red:0,gray:0,build:0,design:0,plan:0};
  tickets.forEach(function(t){
    cnt[t.health||'gray']=(cnt[t.health||'gray']||0)+1;
    if(t.stage>=3)cnt.build++; else if(t.stage>=1)cnt.design++; else cnt.plan++;
  });
  $('ovChips').innerHTML=
    '<span class="chip c-gray">'+tickets.length+' '+esc(T('feature'))+' · '+parked.length+' 🅿</span>'
    +'<span class="chip c-green">'+cnt.green+' '+esc(T('green'))+'</span>'
    +'<span class="chip c-amber">'+cnt.amber+' '+esc(T('amber'))+'</span>'
    +'<span class="chip c-red">'+cnt.red+' '+esc(T('red'))+'</span>'
    +'<span class="chip c-gray">'+cnt.gray+' '+esc(T('gray'))+'</span>'
    +'<span class="chip c-gray">'+cnt.build+' '+esc(T('statBuild'))+' · '+cnt.design+' '+esc(T('statDesign'))+' · '+cnt.plan+' '+esc(T('statPlan'))+'</span>';

  /* filter bar */
  renderFilterBar(allTickets);
  $('fCount').textContent=F('fCount',{n:filtered.length, t:allTickets.length});

  /* heatmap */
  $('hmT').textContent=T('hm'); $('hmC').textContent=filtered.length+'';
  var hh='<th>'+esc(T('feature'))+'</th>';
  STAGE_KEYS.forEach(function(k){ hh+='<th>'+esc(T(k))+'</th>'; });
  hh+='<th></th>';
  $('hmHead').innerHTML=hh;
  $('hmEmpty').style.display=filtered.length?'none':'block';
  $('hmEmpty').textContent=T('fEmptyMsg');
  var hb='';
  filtered.forEach(function(t){
    hb+='<tr><td class="name">'+esc(pick(t.title))+'<span class="k">'+esc(t.key)+'</span></td>';
    for(var s=0;s<5;s++){
      var cls='x';
      if(s<t.stage) cls='g';
      else if(s===t.stage) cls=(t.health==='red')?'r':(t.health==='amber')?'a':(t.health==='green')?'g':'x';
      hb+='<td><span class="cell '+cls+'" title="'+esc(T(STAGE_KEYS[s]))+'"></span></td>';
    }
    hb+='<td class="why">'+esc(pick(t.healthWhy)||'')+'</td></tr>';
  });
  $('hmBody').innerHTML=hb;

  /* timeline */
  $('tlT').textContent=T('tl');
  renderTimeline(filtered);

  /* cards */
  $('cdT').textContent=T('cd'); $('cdC').textContent=filtered.length+'';
  $('cdEmpty').style.display=filtered.length?'none':'block';
  $('cdEmpty').textContent=T('fEmptyMsg');
  $('cards').innerHTML=filtered.map(cardHTML).join('');

  /* parked */
  $('pkT').textContent=T('parked'); $('pkC').textContent='('+parked.length+')';
  $('pkNote').textContent=T('parkedNote');
  $('pkList').innerHTML=parked.map(prowHTML).join('');

  /* footer */
  $('foot').innerHTML=esc(F('foot1',{a:tickets.length,p:parked.length,j:d.junkDropped||0}))+'<br>'+esc(F('foot2',{}));

  applyView();
}
function cardHTML(t){
  return '<div class="card"><div class="top"><span class="k">'+esc(t.key)+'</span>'
    +'<span class="pill '+healthPill(t.health)+'">'+esc(T(t.health||'gray'))+' · '+esc(T(STAGE_KEYS[Math.min(Math.max(t.stage||0,0),4)]))+'</span></div>'
    +'<h3>'+esc(pick(t.title))+'</h3>'
    +'<div class="row"><span class="lb">'+esc(T('what'))+'</span>'+esc(pick(t.what))+'</div>'
    +'<div class="row"><span class="lb">'+esc(T('now'))+'</span>'+esc(pick(t.now))+'</div>'
    +'<div class="row"><span class="lb">'+esc(T('when'))+'</span>'+esc(pick(t.when))+'</div>'
    +(pick(t.healthWhy)?('<div class="hw">'+esc(T('healthWhy'))+':'+esc(pick(t.healthWhy))+'</div>'):'')
    +'<a class="jl" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(T('jira'))+'</a></div>';
}
function prowHTML(p){
  var it=pick(p.intent);
  return '<div class="prow"><span class="k">'+esc(p.key)+'</span><span class="t">'+esc(pick(p.title))+'</span>'
    +'<span class="d" title="'+esc(T('pUpd'))+'">'+esc(fmtDate(p.updated))+'</span>'
    +'<a class="go" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(T('open'))+'</a>'
    +(it?('<span class="i">'+esc(it)+'</span>'):'')+'</div>';
}

function renderTimeline(tickets){
  var box=$('tlBox');
  var withDates=tickets.filter(function(t){return t.dates&&(t.dates.start||t.dates.t0)&&t.dates.t4;})
    .slice().sort(function(a,b){ return (a.dates.t4<b.dates.t4)?-1:1; });
  $('tlC').textContent=withDates.length+'';
  if(!withDates.length){ box.innerHTML='<div style="font-size:13px;color:var(--ink3)">—</div>'; return; }
  var td=todayISO();
  var min=null,max=null;
  withDates.forEach(function(t){
    var s=t.dates.start||t.dates.t0, e=t.dates.t4;
    if(!min||s<min)min=s; if(!max||e>max)max=e;
  });
  if(td<min)min=td; if(td>max)max=td;
  var minD=new Date(min), maxD=new Date(max);
  minD.setDate(minD.getDate()-4); maxD.setDate(maxD.getDate()+4);
  var span=maxD-minD;
  function X(iso){ return Math.max(0,Math.min(100,((new Date(iso)-minD)/span)*100)); }
  var h='';
  withDates.forEach(function(t){
    var s=t.dates.start||t.dates.t0, e=t.dates.t4;
    var col=(t.health==='red')?'var(--red)':(t.health==='amber')?'var(--amber)':(t.health==='green')?'var(--green)':'var(--gray)';
    h+='<div class="tl-row"><div class="tl-name" title="'+esc(t.key)+'">'+esc(pick(t.title))+'</div><div class="tl-track">';
    var x1=X(s), x2=X(e), xt=X(td);
    var fillEnd=Math.min(Math.max(xt,x1),x2);
    h+='<div class="tl-fill" style="left:'+x1+'%;width:'+Math.max(fillEnd-x1,0.6)+'%;background:'+col+';opacity:.85"></div>';
    h+='<div class="tl-fill" style="left:'+fillEnd+'%;width:'+Math.max(x2-fillEnd,0)+'%;background:var(--gray-bg)"></div>';
    ['t0','t1','t2','t3'].forEach(function(k){ if(t.dates[k]) h+='<div class="tl-tick" style="left:'+X(t.dates[k])+'%" title="'+esc(fmtDate(t.dates[k]))+'"></div>'; });
    h+='<div class="tl-today" style="left:'+xt+'%"></div>';
    h+='</div><div style="font-family:var(--mono);font-size:11px;color:var(--ink3);width:88px;flex-shrink:0">'+esc(fmtDate(s))+'→'+esc(fmtDate(e))+'</div></div>';
  });
  h+='<div class="tl-axis"><span>'+esc(fmtDate(min))+'</span><span style="color:var(--live);font-weight:700">'+esc(T('today'))+' '+esc(fmtDate(td))+'</span><span>'+esc(fmtDate(max))+'</span></div>';
  h+='<div class="tl-legend">'+esc(T('legend'))+'</div>';
  box.innerHTML=h;
}

/* ---------------- search ---------------- */
function tHay(t){
  var parts=[t.key];
  ['title','what','now','when','healthWhy'].forEach(function(f){
    if(t[f]){ parts.push(t[f].zh||'', t[f].en||'', t[f].ja||''); }
  });
  if(t.rawSummary) parts.push(t.rawSummary);
  return parts.join(' ').toLowerCase();
}
function pHay(p){
  var parts=[p.key];
  ['title','intent'].forEach(function(f){ if(p[f]){ parts.push(p[f].zh||'', p[f].en||'', p[f].ja||''); } });
  if(p.rawSummary) parts.push(p.rawSummary);
  return parts.join(' ').toLowerCase();
}
function renderSearch(){ applyView(); }
function renderSearchResults(){
  var q=state.q.trim().toLowerCase();
  if(!q) return;
  var at=(DATA.tickets||[]).filter(function(t){ return tHay(t).indexOf(q)>=0; }).sort(sortTickets);
  var pk=(DATA.parked||[]).filter(function(p){ return pHay(p).indexOf(q)>=0; });
  $('sCount').textContent=(at.length||pk.length)?F('sFound',{a:at.length,p:pk.length}):T('sNone');
  $('sCards').innerHTML=at.map(cardHTML).join('');
  $('sParkedWrap').style.display=pk.length?'':'none';
  $('sParkedT').textContent=T('sParked')+' ('+pk.length+')';
  $('sParked').innerHTML=pk.map(prowHTML).join('');
}
function clearSearch(){ state.q=''; $('q').value=''; renderSearch(); }

/* ---------------- boot ---------------- */
$('q').addEventListener('input', function(e){ state.q=e.target.value; applyView(); });
render();
</script>
