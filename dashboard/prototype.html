<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);

  /* ---- 安全的 DOM 小工具：只用 createElement / textContent 放文字，不把字串當 HTML 解析 ---- */
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function svg(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function md(iso) { var p = iso.split("-"); return (+p[1]) + "/" + (+p[2]); }
  function safeUrl(u) { return /^https:\/\//.test(u || "") ? u : null; }
  function link(href, text) {
    var u = safeUrl(href);
    return u ? el("a", { href: u, target: "_blank", rel: "noopener", text: text }) : el("span", { text: text });
  }

  var R = D.rules;
  var weekLbl = D.weeks.map(md);

  /* ---- 痛點排序：🔥 → 🔁 且沒人負責 → 其他沒人負責；同組內依上週人數 ---- */
  function prio(p) {
    if (p.rule.emerging) return 0;
    if (p.rule.persistent && p.noOwner) return 1;
    if (p.rule.persistent) return 2;
    if (p.noOwner) return 3;
    if (p.rule.fading) return 4;
    return 9;
  }
  var pains = D.pains.slice().sort(function (a, b) {
    return prio(a) - prio(b) || b.latest - a.latest;
  });
  var todo = pains.filter(function (p) { return prio(p) < 9; });

  function chipsFor(p) {
    var c = [];
    if (p.rule.emerging) c.push(el("span", { class: "chip c-hot", text: "🔥 新興高熱" }));
    if (p.rule.persistent) c.push(el("span", { class: "chip c-keep", text: "🔁 持續高熱" }));
    if (p.rule.fading) c.push(el("span", { class: "chip c-fade", text: "📉 消退" }));
    if (p.noOwner) c.push(el("span", { class: "chip c-gap", text: "沒人負責" }));
    if (p.allZero) c.push(el("span", { class: "chip c-mute", text: "7 週都是 0 位" }));
    return c;
  }

  /* ---- 頂端：資料日期＋一句話結論 ---- */
  document.getElementById("asof").textContent =
    "聲音資料：" + md(D.latestWeek.start) + "–" + md(D.latestWeek.end) + " 那一週　·　Roadmap：" + md(D.jiraAsOf);
  var nE = D.pains.filter(function (p) { return p.rule.emerging; }).length;
  var nP = D.pains.filter(function (p) { return p.rule.persistent; }).length;
  var nF = D.pains.filter(function (p) { return p.rule.fading; }).length;
  var nG = D.pains.filter(function (p) { return p.noOwner; }).length;
  var bl = document.getElementById("bluf");
  [["本週 ", ""], [nE, "b"], [" 個新興高熱、", ""], [nP, "b"], [" 個持續高熱、", ""], [nF, "b"],
   [" 個消退；", ""], [nG, "b"], [" 個有聲音的痛點還沒人負責；Roadmap 近 7 天有 ", ""], [D.worse.length, "b"], [" 件變差。", ""]]
    .forEach(function (x) { bl.appendChild(x[1] ? el("b", { text: String(x[0]) }) : document.createTextNode(String(x[0]))); });

  /* ---- 分頁 ---- */
  var TABS = [
    ["today", "今天要處理"], ["pains", "痛點（" + D.pains.length + "）"], ["roadmap", "Roadmap"],
    ["slack", "Slack＋表單"], ["health", "資料來源狀態"]
  ];
  var state = { tab: "today", sel: todo.length ? todo[0].code : pains[0].code, filter: "all" };
  var tabsEl = document.getElementById("tabs"), view = document.getElementById("view");
  TABS.forEach(function (t) {
    tabsEl.appendChild(el("button", { role: "tab", id: "tab-" + t[0], "aria-selected": "false", text: t[1],
      onclick: function () { go(t[0]); } }));
  });
  function go(tab) {
    state.tab = tab;
    TABS.forEach(function (t) {
      document.getElementById("tab-" + t[0]).setAttribute("aria-selected", t[0] === tab ? "true" : "false");
    });
    clear(view);
    ({ today: viewToday, pains: viewPains, roadmap: viewRoadmap, slack: viewSlack, health: viewHealth })[tab]();
  }

  /* ---- 清單列 ---- */
  function painRow(p, onPick) {
    var r = el("div", { class: "row", role: "button", tabindex: "0", "aria-current": p.code === state.sel ? "true" : "false" }, [
      el("span", { class: "code", text: p.code }),
      el("span", { class: "ttl" }, [el("span", { class: "t", text: p.title }), el("span", { class: "chips" }, chipsFor(p))]),
      el("span", { class: "num" }, [String(p.latest), el("small", { text: "位／上週" })])
    ]);
    function pick() { state.sel = p.code; onPick(); }
    r.addEventListener("click", pick);
    r.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    return r;
  }

  /* ---- 首頁：今天要處理 ---- */
  function viewToday() {
    var left = el("div", { class: "panel" }, [el("h2", { text: "要處理的痛點（最急的在最上面）" })]);
    var list = el("div", { class: "list" });
    todo.forEach(function (p) { list.appendChild(painRow(p, function () { go("today"); })); });
    left.appendChild(list);

    left.appendChild(el("h3", { text: "ROADMAP 卡變差（近 7 天，與 " + md(D.worseSince) + " 相比）" }));
    if (!D.worse.length) left.appendChild(el("div", { class: "empty", text: "沒有卡變差。" }));
    D.worse.forEach(function (w) {
      left.appendChild(el("div", { class: "row", style: "cursor:default" }, [
        el("span", { class: "code", text: w.key.replace("APPIDEAS-", "#") }),
        el("span", { class: "ttl" }, [link(w.url, w.summary),
          el("span", { class: "chips" }, [el("span", { class: "chip " + (w.what === "狀態變差" ? "c-hot" : "c-warn"),
            text: w.what + "：" + w.from + " → " + w.to })])]),
        el("span")
      ]));
    });
    view.appendChild(el("div", { class: "split" }, [left, detail(find(state.sel))]));
  }

  function find(code) { for (var i = 0; i < D.pains.length; i++) if (D.pains[i].code === code) return D.pains[i]; return D.pains[0]; }

  /* ---- 痛點細節（右欄） ---- */
  function detail(p) {
    var r = p.rule;
    var box = el("section", { class: "panel", "aria-label": "痛點細節" });
    box.appendChild(el("div", { class: "d-head" }, [el("span", { class: "code", text: p.code }), el("h2", { text: p.title })]));
    box.appendChild(el("div", { class: "chips" }, chipsFor(p)));
    var big = el("div", { class: "d-big" });
    big.appendChild(el("b", { text: String(p.latest) }));
    big.appendChild(document.createTextNode(" 位主播在 " + md(D.latestWeek.start) + " 那週提到（週報固定統計）　·　VoC 分數 " + p.vocScore));
    box.appendChild(big);

    box.appendChild(el("h3", { text: "每週主播人數（最近 2 週用深色標出）" }));
    box.appendChild(el("div", { class: "chart" }, [chart(p.series)]));
    box.appendChild(el("div", { class: "rules" }, [
      ruleLine(r.emerging, "新興高熱：最近 2 週平均 " + r.recent2 + " 位（門檻 ≥ " + R.emergeMin + "），前 4 週平均 " + r.prior4 + " 位" +
        (r.prior4 >= 2 ? "，是 " + (r.prior4 ? (r.recent2 / r.prior4).toFixed(1) : "—") + " 倍（門檻 ≥ 2 倍）" : "（< 2 位，不看倍數）")),
      ruleLine(r.persistent, "持續高熱：最近 6 週有 " + r.hotWeeks + " 週 ≥ " + R.persistMin + " 位（門檻 ≥ 4 週）"),
      ruleLine(r.fading, "消退：最近 3 週每週都比前一週低（" + p.series.slice(-4).join(" → ") + "）")
    ]));

    if (p.themes.length) {
      box.appendChild(el("h3", { text: "同時被歸到的主題（上週，同一位主播）" }));
      box.appendChild(el("div", { class: "chips" }, p.themes.map(function (t) {
        return el("span", { class: "chip c-mute", text: t.code + " " + t.name + "　" + t.n + " 位" });
      })));
    }

    /* 細分類（佔位） */
    box.appendChild(el("h3", { text: "細分類" }));
    var sub = el("div", { class: "ph" }, [el("div", { class: "ph-tag", text: "佔位，正式版改用 Gemini 判定結果" })]);
    [["問題類型 A × 發生位置 A", "—"], ["問題類型 B × 發生位置 A", "—"], ["問題類型 A × 發生位置 C", "—"]].forEach(function (s) {
      sub.appendChild(el("div", { class: "sub" }, [el("span", { text: s[0] }), el("span", { class: "n", text: s[1] + " 位" })]));
    });
    sub.appendChild(el("div", { class: "note", text: "細分類只算「經過 Gemini 判定的主播」，和上面週報的人數來源不同，加總不會一樣。" }));
    box.appendChild(sub);

    /* 代表原話（佔位）：正式版由伺服器端依固定痛點代碼查詢、純文字顯示、不含主播 ID */
    box.appendChild(el("h3", { text: "代表原話" }));
    var qs = el("div", { class: "ph" }, [el("div", { class: "ph-tag", text: "佔位，正式版只在公司網域內、你允許的人才看得到" })]);
    [1, 2, 3].forEach(function (i) {
      var ctx = el("div", { class: "ctx", text: "（前後文佔位：原話前後各幾句，正式版顯示）" });
      ctx.hidden = true;
      var b = el("button", { class: "btn", type: "button", text: "看前後文", "aria-expanded": "false" });
      b.addEventListener("click", function () {
        ctx.hidden = !ctx.hidden;
        b.setAttribute("aria-expanded", ctx.hidden ? "false" : "true");
        b.textContent = ctx.hidden ? "看前後文" : "收起前後文";
      });
      qs.appendChild(el("div", { class: "quote" }, [
        el("div", { class: "sum", text: "摘要佔位 " + i + "：Gemini 對這段話的一句話摘要" }),
        el("div", { class: "txt", text: "「原話佔位 " + i + "：主播在直播中實際說的話會顯示在這裡」" }),
        el("div", { class: "meta", text: (i === 1 ? "sTop" : i === 2 ? "Top" : "一般") + " 主播 · " + md(D.latestWeek.start) + " 那週" }),
        b, ctx
      ]));
    });
    box.appendChild(qs);

    /* 負責的卡：由 Cross 自己指定（D3），連到既有編輯頁 */
    box.appendChild(el("h3", { text: "負責的 Roadmap 卡" }));
    if (p.cards.length) {
      p.cards.forEach(function (k) { box.appendChild(el("div", { text: k })); });
    } else {
      box.appendChild(el("div", { class: "empty", style: "padding-left:0", text: "還沒有指定。" }));
    }
    var ed = safeUrl(D.editorUrl);
    if (ed) box.appendChild(el("a", { class: "btn primary", href: ed, target: "_blank", rel: "noopener", text: "去指定負責的卡 ↗" }));
    box.appendChild(el("div", { class: "note", text: "會開啟你現有的「誰在處理這個痛點」頁面，存檔後隔天這裡會自動更新。" }));
    return box;
  }

  function ruleLine(ok, text) {
    return el("div", { class: "rule " + (ok ? "yes" : "no") }, [el("span", { class: "mk", text: ok ? "✓" : "—" }), el("span", { text: text })]);
  }

  /* ---- 週柱狀圖：同一把尺畫柱、刻度、門檻線 ---- */
  function chart(s) {
    var W = 620, H = 190, L = 34, Rr = 70, T = 14, B = 26;
    var max = Math.max(R.persistMin + 5, Math.max.apply(null, s)) * 1.1;
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var bw = (W - L - Rr) / s.length;
    var g = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "每週主播人數：" + s.join("、") });
    [0, Math.round(max / 2)].forEach(function (v) {
      g.appendChild(svg("line", { x1: L, x2: W - Rr, y1: y(v), y2: y(v), stroke: "var(--line)" }));
      var t = svg("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.textContent = String(v); g.appendChild(t);
    });
    s.forEach(function (v, i) {
      var x = L + i * bw + bw * 0.18, w = bw * 0.64, hi = i >= s.length - 2;
      g.appendChild(svg("rect", { x: x, y: y(v), width: w, height: Math.max(0, y(0) - y(v)), rx: 2, fill: hi ? "var(--bar-hi)" : "var(--bar)" }));
      var t = svg("text", { x: x + w / 2, y: y(v) - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)" });
      t.textContent = String(v); g.appendChild(t);
      var d = svg("text", { x: x + w / 2, y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
      d.textContent = weekLbl[i]; g.appendChild(d);
    });
    [[R.emergeMin, "新興門檻 " + R.emergeMin], [R.persistMin, "持續門檻 " + R.persistMin]].forEach(function (m) {
      if (m[0] > max) return;
      g.appendChild(svg("line", { x1: L, x2: W - Rr, y1: y(m[0]), y2: y(m[0]), stroke: "var(--muted)", "stroke-dasharray": "4 4" }));
      var t = svg("text", { x: W - Rr + 6, y: y(m[0]) + 4, "text-anchor": "start", "font-size": 10, fill: "var(--muted)" });
      t.textContent = m[1]; g.appendChild(t);
    });
    return g;
  }

  /* ---- 痛點分頁：全部 25 個＋篩選 ---- */
  function viewPains() {
    var F = [["all", "全部"], ["emerging", "🔥 新興"], ["persistent", "🔁 持續"], ["fading", "📉 消退"], ["noOwner", "沒人負責"]];
    var left = el("div", { class: "panel" });
    var fl = el("div", { class: "filters" });
    F.forEach(function (f) {
      fl.appendChild(el("button", { class: "chipf", type: "button", "aria-pressed": state.filter === f[0] ? "true" : "false", text: f[1],
        onclick: function () { state.filter = f[0]; go("pains"); } }));
    });
    left.appendChild(fl);
    var rows = pains.filter(function (p) {
      return state.filter === "all" || (state.filter === "noOwner" ? p.noOwner : p.rule[state.filter]);
    });
    var list = el("div", { class: "list" });
    if (!rows.length) list.appendChild(el("div", { class: "empty", text: "這一週沒有符合的痛點。" }));
    rows.forEach(function (p) { list.appendChild(painRow(p, function () { go("pains"); })); });
    left.appendChild(list);
    if (D.outside.length) {
      left.appendChild(el("div", { class: "note", text: "不在 25 個痛點清單內但聲量高：" +
        D.outside.map(function (o) { return o.code + "（上週 " + o.latest + " 位）"; }).join("、") + "。" }));
    }
    view.appendChild(el("div", { class: "split" }, [left, detail(find(state.sel))]));
  }

  /* ---- Roadmap 分頁 ---- */
  function viewRoadmap() {
    var total = D.cards.length;
    var order = ["Discovery", "Design", "Develop", "Impact"];
    var sb = el("div", { class: "stagebar" });
    order.forEach(function (s) {
      var n = D.stages[s] || 0; if (!n) return;
      sb.appendChild(el("div", { style: "flex:" + n, title: s + " " + n, text: n >= 3 ? s + " " + n : String(n) }));
    });
    var top = el("div", { class: "panel" }, [el("h2", { text: "進行中 " + total + " 張卡，各階段張數" }), sb,
      el("div", { class: "legend", text: order.map(function (s) { return s + " " + (D.stages[s] || 0); }).join("　·　") })]);

    var lt = el("table", {}, [el("thead", {}, [el("tr", {}, ["團隊", "卡", "點數", "手上工作量（月）", "狀態"].map(function (h) { return el("th", { text: h }); }))])]);
    var tb = el("tbody");
    D.load.forEach(function (r) {
      var v = r.verdict === "overload" ? ["c-hot", "過載"] : r.verdict === "healthy" ? ["c-ok", "正常"] : ["c-mute", "沒有基準"];
      tb.appendChild(el("tr", {}, [el("td", { text: r.domain }), el("td", { class: "n", text: String(r.cards) }),
        el("td", { class: "n", text: String(r.points) }), el("td", { class: "n", text: r.months == null ? "—" : r.months.toFixed(1) }),
        el("td", {}, [el("span", { class: "chip " + v[0], text: v[1] })])]));
    });
    lt.appendChild(tb);
    var loadP = el("div", { class: "panel" }, [el("h2", { text: "團隊負荷" }), el("div", { class: "tbl" }, [lt])]);
    if (D.baselineExpired) loadP.appendChild(el("div", { class: "note", text: "注意：產能基準 " + md(D.baselineExpiresAt) + " 已過期，等 PMT 給新一季的數字；目前沿用上一季。" }));

    var up = el("div", { class: "panel" }, [el("h2", { text: "接下來要上線" })]);
    var ut = el("table", {}, [el("thead", {}, [el("tr", {}, ["日期", "卡", "團隊", "狀態"].map(function (h) { return el("th", { text: h }); }))])]);
    var ub = el("tbody");
    D.upcoming.forEach(function (u) {
      ub.appendChild(el("tr", {}, [el("td", { text: md(u.date) }), el("td", {}, [link("https://17media.atlassian.net/browse/" + u.key, u.summary)]),
        el("td", { text: u.domain }), el("td", {}, [statusChip(u.project_status)])]));
    });
    ut.appendChild(ub); up.appendChild(el("div", { class: "tbl" }, [ut]));

    var ub2 = el("div", { class: "panel" }, [el("h2", { text: "標了 VoC 但還沒對到痛點的卡（" + D.unbacked.length + "）" })]);
    D.unbacked.forEach(function (c) {
      ub2.appendChild(el("div", { class: "row", style: "cursor:default" }, [el("span", { class: "code", text: c.key.replace("APPIDEAS-", "#") }),
        el("span", { class: "ttl" }, [link(c.url, c.summary), el("span", { class: "chips" }, [el("span", { class: "chip c-mute", text: c.stage }), statusChip(c.project_status)])]), el("span")]));
    });

    var all = el("div", { class: "panel" }, [el("h2", { text: "全部卡片" })]);
    var at = el("table", {}, [el("thead", {}, [el("tr", {}, ["卡", "階段", "狀態", "團隊", "預計上線"].map(function (h) { return el("th", { text: h }); }))])]);
    var ab = el("tbody");
    D.cards.slice().sort(function (a, b) { return (b.project_status !== "On track") - (a.project_status !== "On track") || (a.release_date || "9").localeCompare(b.release_date || "9"); })
      .forEach(function (c) {
        ab.appendChild(el("tr", {}, [el("td", {}, [link(c.url, c.summary)]), el("td", { text: c.stage }), el("td", {}, [statusChip(c.project_status)]),
          el("td", { text: c.domain || "—" }), el("td", { text: c.release_date ? md(c.release_date) : "未定" })]));
      });
    at.appendChild(ab); all.appendChild(el("div", { class: "tbl" }, [at]));

    view.appendChild(el("div", { style: "display:grid;gap:16px" }, [top, el("div", { class: "grid2" }, [loadP, up]), ub2, all]));
  }
  function statusChip(s) {
    var c = s === "On track" ? "c-ok" : s === "Warning" ? "c-warn" : "c-hot";
    var t = s === "On track" ? "正常" : s === "Warning" ? "注意" : s === "At Risk" ? "有風險" : s;
    return el("span", { class: "chip " + c, text: t });
  }

  /* ---- Slack＋表單（取代舊的 VoC Console）---- */
  function viewSlack() {
    var p1 = el("div", { class: "panel" }, [el("h2", { text: "每日新增聲音（Slack #UserFeedback ＋ 4 份表單）" })]);
    var ph = el("div", { class: "ph" }, [el("div", { class: "ph-tag", text: "佔位，正式版讀 VoC Daily Bot 的試算表（只讀不寫）" })]);
    var t = el("table", {}, [el("thead", {}, [el("tr", {}, ["來源", "昨天", "近 7 天", "已對到痛點", "新痛點候選"].map(function (h) { return el("th", { text: h }); }))])]);
    var b = el("tbody");
    ["Slack #UserFeedback", "VIP Feedback", "JP feature requests", "JP feedback for Cross", "プロライバー定例会"].forEach(function (s) {
      b.appendChild(el("tr", {}, [el("td", { text: s }), el("td", { class: "n", text: "—" }), el("td", { class: "n", text: "—" }), el("td", { class: "n", text: "—" }), el("td", { class: "n", text: "—" })]));
    });
    t.appendChild(b); ph.appendChild(el("div", { class: "tbl" }, [t])); p1.appendChild(ph);

    var p2 = el("div", { class: "panel" }, [el("h2", { text: "最新聲音" })]);
    var ph2 = el("div", { class: "ph" }, [el("div", { class: "ph-tag", text: "佔位" })]);
    [["S2.1", "已對到痛點"], ["CAND", "新痛點候選"], ["U4.1", "已對到痛點"]].forEach(function (x, i) {
      ph2.appendChild(el("div", { class: "quote" }, [
        el("div", { class: "sum", text: "摘要佔位 " + (i + 1) }),
        el("div", { class: "txt", text: "「原文佔位：Slack 或表單裡的原文」" }),
        el("div", { class: "meta", text: "來源 · 日期 · " + x[1] + "（" + x[0] + "）" })
      ]));

    p2.appendChild(ph2);
    p2.appendChild(el("div", { class: "note", text: "對到痛點的聲音會一起出現在「痛點」頁該痛點的原話區，和直播原話放在一起看。舊的 VoC Console 網址改成直接轉到這一頁。" }));
    view.appendChild(el("div", { class: "grid2" }, [p1, p2]));
  }

  /* ---- 資料來源狀態 ---- */
  function viewHealth() {
    var rows = [
      ["Jira Roadmap", "每天 09:00 自動更新", md(D.jiraAsOf), "c-ok", "正常"],
      ["直播原話（STT）週統計", "每天 08:30 抓一次，週報每週一批", md(D.latestWeek.start) + "–" + md(D.latestWeek.end) + " 那週（" + md(D.sttFetched) + " 抓到）", D.sttAgeDays > 10 ? "c-warn" : "c-ok", D.sttAgeDays > 10 ? "注意" : "正常"],
      ["Slack＋表單", "每天 08:10", "正式版顯示", "c-mute", "尚未接上"],
      ["客服工單、聊天機器人", "—", "—", "c-mute", "還沒納入"]
    ];
    var t = el("table", {}, [el("thead", {}, [el("tr", {}, ["來源", "更新頻率", "最新資料", "狀態"].map(function (h) { return el("th", { text: h }); }))])]);
    var b = el("tbody");
    rows.forEach(function (r) { b.appendChild(el("tr", {}, [el("td", { text: r[0] }), el("td", { text: r[1] }), el("td", { text: r[2] }), el("td", {}, [el("span", { class: "chip " + r[3], text: r[4] })])])); });
    t.appendChild(b);
    var p = el("div", { class: "panel" }, [el("h2", { text: "資料來源狀態" }), el("div", { class: "tbl" }, [t])]);
    var zero = D.pains.filter(function (x) { return x.allZero; }).map(function (x) { return x.code; });
    if (zero.length) p.appendChild(el("div", { class: "note", text: "數字可能不準：" + zero.join("、") + " 這 7 週都是 0 位，可能是週報沒有統計這幾個痛點，不代表沒人抱怨。" }));
    p.appendChild(el("div", { class: "note", text: "時間段分析目前只有 7 週資料；正式版會拉到至少 10 週。" }));
    view.appendChild(p);
  }

  go("today");
})();
