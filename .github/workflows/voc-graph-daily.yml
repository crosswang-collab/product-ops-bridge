# 每天把 STT 聲音 × VoC 25 痛點 × Jira 卡接成一張圖，驗收通過才 commit 回 main，Vercel 自動 redeploy。
#
# 契約卡與部署步驟見 voc-graph/README.md。這支 workflow 不呼叫任何 LLM，也不連 GCP。
#
# 資料來源（都已經在 repo 裡）：
#   roadmap-bot/out/latest.json     ← roadmap-daily 每天寫入
#   voc-graph/out/stt-latest.json   ← Apps Script（voc-graph/gas/SttExport.gs）每天 08:30 JST 以 Cross 身分讀 BigQuery 後推入
#                                      （公司禁止 GCP 服務帳號金鑰，所以不在 Actions 裡連 BigQuery）
#
# 觸發：roadmap-daily 成功跑完之後（確保 Jira 是今天的）；也可以手動觸發。
#       另外：mapping.json 一被改（編輯頁存檔）就重算，以「最新一份 Jira 快照的日期」為準，
#       讓對應表的修改幾分鐘內就反映在頁面上，不用等隔天。
# 驗收（check.py）沒過 → 不 commit，頁面維持前一天的版本，workflow 紅燈，GitHub 寄信給 repo watcher。
# STT 超過 14 天沒被 Apps Script 更新 → check.py C4 紅燈。

name: voc-graph-daily

on:
  workflow_run:
    workflows: [roadmap-daily]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['voc-graph/mapping.json']

concurrency:
  group: voc-graph-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  graph:
    # roadmap-daily 失敗就不跑：Jira 不是今天的，跑了也一定驗收不過
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 對齊契約 BUDGET：單輪 ≤ 10 分鐘

    steps:
      - name: 取出 repo（main 最新，含 roadmap-daily 剛推的 Jira 快照）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 決定這一輪的日期
        id: day
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 對應表修改：用現有 Jira 快照的日期重算同一天的圖（不假裝 Jira 是今天抓的）
            D=$(python3 -c "import json;print(json.load(open('roadmap-bot/out/latest.json'))['as_of_date'])")
            echo "::notice::對應表修改觸發，以 Jira 快照日 $D 重算。"
          else
            D=$(date -u +%F)
          fi
          echo "today=$D" >> "$GITHUB_OUTPUT"

      - name: 組圖
        run: python3 voc-graph/build.py --today ${{ steps.day.outputs.today }}

      - name: 驗收（checker）
        run: python3 voc-graph/check.py --today ${{ steps.day.outputs.today }}

      - name: Commit（只在驗收通過、且資料有變時）
        run: |
          git config user.name  "voc-graph-bot"
          git config user.email "voc-graph-bot@users.noreply.github.com"
          git add voc-graph/out/
          if git diff --cached --quiet; then
            echo "::notice::資料沒有變化，不產生空 commit。"
            exit 0
          fi
          AS_OF=$(python3 -c "import json;print(json.load(open('voc-graph/out/latest.json'))['as_of_date'])")
          SUM=$(python3 -c "import json;v=json.load(open('voc-graph/out/latest.json'))['views'];print(f\"變多 {len(v['rising'])}／沒卡 {len(v['gaps'])}／VoC 卡沒對應 {len(v['unbacked_voc_cards'])}\")")
          git commit -m "data(voc-graph): ${AS_OF} 對照圖（${SUM}）" -m "由 .github/workflows/voc-graph-daily.yml 自動產生，check.py 驗收 PASS。"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "::notice::已推上 main，Vercel 會自動 redeploy。"
              exit 0
            fi
            echo "push 失敗（第 $i 次），拉取後重試…"
            git pull --rebase origin main || exit 1
            sleep $((2 ** i))
          done
          echo "::error::重試三次仍推不上去。"
          exit 1

      - name: 把每日摘要放進 job summary
        if: always()
        run: |
          B=$(ls -1 voc-graph/out/brief-*.md 2>/dev/null | sort | tail -1)
          if [ -n "$B" ]; then cat "$B" >> "$GITHUB_STEP_SUMMARY"; fi
