<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JP Needs Tank · Dashboard</title>
<style>
:root{--bg:#0b0e14;--s1:#141a24;--bd:#232c3a;--tx:#e6ebf4;--mut:#8b96a8;--dim:#5a6577;--acc:#5fd3e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#121826,#0b0e14);color:var(--tx);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:560px;width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:34px 30px 30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.01em}
.sub{color:var(--mut);font-size:13px;margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:12px}
a.opt{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tx);background:#10151f;border:1px solid var(--bd);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px;transition:background .12s,transform .06s}
a.opt:hover{background:rgba(95,211,230,.07);transform:translateY(-1px)}
a.opt .flag{font-size:26px;flex:0 0 auto}
a.opt .m{flex:1}
a.opt .t{font-size:15px;font-weight:700}
a.opt .d{font-size:11.5px;color:var(--mut);margin-top:2px}
a.opt .arw{color:var(--dim);font-size:18px}
.foot{margin-top:22px;font-size:11px;color:var(--dim);line-height:1.6;border-top:1px solid var(--bd);padding-top:14px}
</style>
</head>
<body>
<div class="card">
<h1>🗾 JP Needs Tank</h1>
<p class="sub">日本用戶／實況主需求 · 旅程 × 觸點 · 291件 · v1</p>
<div class="opts">
<a class="opt" href="./dashboard/jp-product-dashboard.html">
  <span class="flag">📊</span>
  <span class="m"><div class="t">JP Product Dashboard</div><div class="d">APPIDEAS 全專案白話進度板 · 中/EN/日切換 · 搜尋票號</div></span>
  <span class="arw">→</span>
</a>
<a class="opt" href="./JP_Needs_Heatmap_ZH.html">
  <span class="flag">🇹🇼</span>
  <span class="m"><div class="t">繁體中文版</div><div class="d">介面繁中 · 原始 request 保留日文原聲</div></span>
  <span class="arw">→</span>
</a>
<a class="opt" href="./JP_Needs_Heatmap_JP.html">
  <span class="flag">🇯🇵</span>
  <span class="m"><div class="t">日本語版</div><div class="d">全日本語 UI · JP チーム共有用</div></span>
  <span class="arw">→</span>
</a>
</div>
<p class="foot">Product-Ops Bridge · 内部資料。25 ペイン総合ランキング（ドラッグ並べ替え + 書き出し）と 2 層ドリルダウンを搭載。</p>
</div>
</body>
</html>
